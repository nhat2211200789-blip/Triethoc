"chapter":3,"number":332,"level":"TB","text":"Trong lực lượng sản xuất, nhân tố quyết định năng suất lao động xã hội là:","options":["Sự tiến bộ của người lao động.","Sự phát triển của công cụ lao động","Phương tiện lao động","Tư liệu lao động"],"correct":[1],"page":45},{"id":"3-333","chapter":3,"number":333,"level":"TB","text":"Quan hệ sản xuất bao gồm:","options":["Quan hệ sản xuất vật chất; quan hệ sản xuất tinh thần và quan hệ sản xuất con người","Quan hệ giữa người lao động và tư liệu sản xuất trong quá trình sản xuât","Quan hệ sở hữu về tư liệu sản xuất; quan hệ trong tổ chức - quản lý quá trình sản xuất và quan hệ mua bán sản phẩm sản xuất ra","Quan hệ sở hữu về tư liệu sản xuất; quan hệ trong tổ chức - quản lý quá trình sản xuất và quan hệ trong phân phối kết quả của quá trình sản xuất"],"correct":[3],"page":45},{"id":"3-334","chapter":3,"number":334,"level":"TB","text":"Quan hệ giữ vai trò quyết định trong quan hệ sản xuất là:","options":["Quan hệ sở hữu về tư liệu sản xuất","Quan hệ trong tổ chức - quản lý quá trình sản xuất","Quan hệ trong phân phối kết quả của quá trình sản xuất","Quan hệ mua bán hàng hóa trong quá trình sản xuất"],"correct":[0],"page":45},{"id":"3-335","chapter":3,"number":335,"level":"TB","text":"Quan hệ sản xuất là:","options":["Tổng hợp các quan hệ kinh tế - vật chất giữa người với người trong quá trình sản xuất vật chất","Mối quan hệ giữa con người với đối tượng lao động","Mối quan hệ giữa con người với công cụ lao động","Mối quan hệ giữa con người với tư liệu sản xuất"],"correct":[0],"page":45},{"id":"3-336","chapter":3,"number":336,"level":"TB","text":"Trong quan hệ sản xuất, quan hệ sở hữu về tư liệu sản xuất có vai trò:","options":["Quy định địa vị kinh tế - xã hội của các tập đoàn người trong sản xuất","Quy định địa vị kinh tế - xã hội của các tầng lớp trong sản xuất","Quy định địa vị xã hội của các giai cấp trong xã hội","Quy định địa vị xã hội của các giai cấp và tầng lớp lao động"],"correct":[0],"page":46},{"id":"3-337","chapter":3,"number":337,"level":"TB","text":"Quy luật chi phối sự vận động và phát triển của các phương thức sản xuất trong lịch sử:","options":["Quy luật đấu tranh giai cấp","Quy luật thống nhất và đấu tranh giữa các mặt đối lập","Quy luật về sự phù hợp của quan hệ sản xuất với trình độ phát triển của lực lượng sản xuất.","Quy luật phủ định của phủ định"],"correct":[2],"page":46},{"id":"3-338","chapter":3,"number":338,"level":"TB","text":"Nguyên nhân dẫn đến sự thay thế các quan hệ sản xuất trong lịch sử:","options":["Sự phát triển của lực lượng sản xuất về tính chất và trình độ","Do ý muốn chủ quan của con người","Do chính bản thân quan hệ sản xuất","Do chế độ chính trị"],"correct":[0],"page":46},{"id":"3-339","chapter":3,"number":339,"level":"TB","text":"Theo C. Mác và Ph. Ăngghen, quá trình thay thế các hình thức sở hữu tư liệu sản xuất phụ thuộc vào:","options":["Trình độ của công cụ sản xuất","Trình độ kỹ thuật sản xuất","Trình độ phân công lao động xã hội","Trình độ phát triển của lực lượng sản xuất"],"correct":[3],"page":46},{"id":"3-340","chapter":3,"number":340,"level":"TB","text":"Thực trạng phát triển nhất định của lực lượng sản xuất tất yếu đòi hỏi sự phù hợp tương ứng khách quan của:","options":["Quan hệ sở hữu đối với tư liệu sản xuất","Quan hệ trong tổ chức - quản lý quá trình sản xuất","Quan hệ trong phân phối kết quả của quá trình sản xuất","Quan hệ sản xuất"],"correct":[3],"page":46},{"id":"3-341","chapter":3,"number":341,"level":"TB","text":"Khi lực lượng sản xuất quyết định sự ra đời của một kiểu quan hệ sản xuất mới trong lịch sử thì :","options":["Quyết định nội dung và tính chất của quan hệ sản xuất","Quyết định sức mua bán của hàng hóa","Quyết định sự phát tiển của nền kinh tế","Quyết định sự ổn định về mặt chính trị của một quốc gia"],"correct":[0],"page":46},{"id":"3-342","chapter":3,"number":342,"level":"TB","text":"Sự thay thế và phát triển của các phương thức sản xuất phản ánh:","options":["Xu hướng tất yếu khách quan của quá trình phát triển xã hội loài người từ trình độ thấp đến trình độ ngày càng cao hơn.","Mong muốn chủ quan của giai cấp thống trị xã hội về kinh tế.","Mong muốn chủ quan của các giai cấp, tầng lớp nhân dân lao động trong xã hội.","Xu hướng vận động và biến đổi của quá trình sản xuất"],"correct":[0],"page":46},{"id":"3-343","chapter":3,"number":343,"level":"TB","text":"Yếu tố quyết định nhất đến sự biến đổi của quan hệ sản xuất là:","options":["Sự phong phú của đối tượng lao động","Công cụ lao động hiện đại","Trình độ phát triển của lực lượng sản xuất","Trình độ của người lao động."],"correct":[2],"page":47},{"id":"3-344","chapter":3,"number":344,"level":"TB","text":"Lực lượng sản xuất là nhân tố cơ bản, tất yếu tạo thành:","options":["Cơ sở hạ tầng của xã hội","Kiến trúc thượng tầng của xã hội","Nội dung vật chất của quá trình sản xuất","Hình thức xã hội của quá trình sản xuất"],"correct":[2],"page":47},{"id":"3-345","chapter":3,"number":345,"level":"TB","text":"Quan hệ sản xuất đóng vai trò là:","options":["Yếu tố quyết định trong phương thức sản xuất.","Nội dung vật chất của quá trình sản xuất","Nội dung tinh thần của quá trình sản xuất","Hình thức xã hội của quá trình sản xuất"],"correct":[3],"page":47},{"id":"3-346","chapter":3,"number":346,"level":"TB","text":"Hình thức xã hội của quá trình sản xuất là:","options":["Quan hệ sở hữu đối với tư liệu sản xuất","Quan hệ trong tổ chức- quản lý quá trình sản xuất","Quan hệ trong phân phối kết quả của quá trình sản xuất","Quan hệ sản xuất"],"correct":[3],"page":47},{"id":"3-347","chapter":3,"number":347,"level":"TB","text":"Vai trò của quan hệ sản xuất đối với sự phát triển của lực lượng sản xuất biểu hiện:","options":["Quan hệ sản xuất phụ thuộc hoàn toàn vào thực trạng phát triển của lực lượng sản xuất","Quan hệ sản xuất luôn luôn tác động tích cực đến sự phát triển của lực lượng sản xuất","Quan hệ sản xuất luôn luôn tác động tiêu cực đến sự phát triển của lực lượng sản xuất","Nếu quan hệ sản xuất phù hợp với thực trạng phát triển của lực lượng sản xuất sẽ có tác dụng tích cực và ngược lại nếu không phù hợp sẽ có tác dụng tiêu cực"],"correct":[3],"page":47},{"id":"3-348","chapter":3,"number":348,"level":"TB","text":"Theo chủ nghĩa duy vật lịch sử “Sự phù hợp của quan hệ sản xuất với trình độ phát triển của lực lượng sản xuất” là:","options":["Đòi hỏi khách quan của nền sản xuất","Không cần thiết","Vật cản trong quá trình phát triển lực lượng sản xuất","Ánh sáng trong phát triển xã hội"],"correct":[0],"page":47},{"id":"3-349","chapter":3,"number":349,"level":"TB","text":"Sự tác động của quan hệ sản xuất đối với lực lượng sản xuất diễn ra theo những chiều hướng:","options":["Thúc đẩy hoặc kìm hãm sự phát triển của lực lượng sản xuất","Mâu thuẫn với sự phát triển của lực lượng sản xuất","Đối lập với sự phát triển của lực lượng sản xuất","Cùng chiều với sự phát triển của lực lượng sản xuất"],"correct":[0],"page":47},{"id":"3-350","chapter":3,"number":350,"level":"TB","text":"Quan điểm: “Trong trạng thái vận động của mâu thuẫn biện chứng giữa lực lượng sản xuất và quan hệ sản xuất diễn ra từ phù hợp đến không phù hợp, rồi đến sự phù hợp mới ở trình độ cao hơn” là của:","options":["Chủ nghĩa duy tâm tôn giáo","Chủ nghĩa duy vật","Chủ nghĩa siêu hình","Chủ nghĩa duy vật lịch sử"],"correct":[3],"page":47},{"id":"3-351","chapter":3,"number":351,"level":"TB","text":"“Quan hệ giai cấp quyết định khuynh hướng phát triển và tính chất của dân tộc là quan điểm” là của:","options":["Chủ nghĩa duy vật lịch sử","Chủ nghĩa duy tâm tôn giáo","Chủ nghĩa duy vật","Chủ nghĩa siêu hình"],"correct":[0],"page":48},{"id":"3-352","chapter":3,"number":352,"level":"TB","text":"Cơ sở hạ tầng là khái niệm dùng để chỉ:","options":["Toàn bộ đất đai, máy móc, phương tiện để sản xuất","Toàn bộ những quan hệ sản xuất của một xã hội trong sự vận động hiện thực của chúng hợp thành cơ cấu kinh tế của xã hội đó","Toàn bộ cơ sở hạ tầng vật chất- kỹ thuật của một khu dân cư nhất định","Toàn bộ những thành phần kinh tế của một xã hội nhất định"],"correct":[1],"page":48},{"id":"3-353","chapter":3,"number":353,"level":"TB","text":"Cấu trúc của cơ sở hạ tầng bao gồm:","options":["Quan hệ sản xuất thống trị; quan hệ sản xuất tàn dư; quan hệ sản xuất mầm mống","Quan hệ sản xuất mầm mống và quan hệ sản xuất tàn dư của xã hội cũ","Quan hệ sở hữu tư liệu sản xuất và quan hệ mua bán hàng hóa sản xuất","Quan hệ sản xuất thống trị và quan hệ sản xuất là mầm mống của xã hội tương lai"],"correct":[0],"page":48},{"id":"3-354","chapter":3,"number":354,"level":"TB","text":"Quan hệ giữ vai trò là đặc trưng cho chế độ kinh tế của một xã hội nhất định trong cơ sở hạ tầng là:","options":["Quan hệ sở hữu tư liệu sản xuất","Quan hệ sản xuất thống trị","Quan hệ sản xuất tàn dư","Quan hệ sản xuất mầm mống"],"correct":[1],"page":48},{"id":"3-355","chapter":3,"number":355,"level":"TB","text":"Khái niệm kiến trúc thượng tầng dùng để chỉ:","options":["Toàn bộ những quan điểm, tư tưởng xã hội với những thiết chế xã hội tương ứng cùng những quan hệ nội tại của thượng tầng hình thành trên một cơ sở hạ tầng.","Toàn bộ hệ thống kết cấu các hình thái ý thức xã hội (hình thái ý thức chính trị, pháp quyền, tôn giáo…)","Toàn bộ hệ thống các thiết chế chính trị- xã hội (nhà nước, chính đảng, các đoàn thể chính trị xã hội...)","Toàn bộ những quan hệ sản xuất hợp thành cơ cấu kinh tế của một xã hội nhất định."],"correct":[0],"page":48},{"id":"3-356","chapter":3,"number":356,"level":"TB","text":"Xét đến cùng, nguyên nhân của những biến đổi từ cơ sở hạ tầng dẫn tới những biến đổi trong kiến trúc thượng tầng là do:","options":["Sự phát triển của lực lượng sản xuất","Sự phát triển của quan hệ sản xuất","Ý thức chủ quan của con người","Sự phát triển của điều kiện vật chất"],"correct":[0],"page":48},{"id":"3-357","chapter":3,"number":357,"level":"TB","text":"Trong xã hội có đối kháng giai cấp, sự biến đổi của cơ sở hạ tầng dẫn tới những biến đổi trong kiến trúc thượng tầng tất yếu phải:","options":["Thông qua vai trò của con người","Thông qua đấu tranh giai cấp","Thông qua cách mạng xã hội","Thông qua đấu tranh giai cấp và cách mạng xã hội"],"correct":[3],"page":48},{"id":"3-358","chapter":3,"number":358,"level":"TB","text":"Tính chất phụ thuộc của kiến trúc thượng tầng vào cơ sở hạ tầng có nguyên nhân từ:","options":["Tính tất yếu kinh tế đối với toàn bộ các lĩnh vực sinh hoạt của xã hội","Tính tất yếu của tồn tại xã hội đối với ý thức xã hội","Kiến trúc thượng tầng nảy sinh trên cơ sở hạ tầng","Kiến trúc thượng tầng là cái phản ánh cơ sở hạ tầng"],"correct":[0],"page":48},{"id":"3-359","chapter":3,"number":359,"level":"TB","text":"Nhân tố trong kiến trúc thượng tầng có tác động trực tiếp nhất và mạnh mẽ nhất tới cơ sở hạ tầng kinh tế của xã hội là:","options":["Các chính đảng","Nhà nước","Các đoàn thể chính trị- xã hội","Giáo hội"],"correct":[1],"page":49},{"id":"3-360","chapter":3,"number":360,"level":"TB","text":"Giai cấp nắm quyền lực nhà nước trong kiến trúc thượng tầng là:","options":["Giai cấp nắm giữ quyền sở hữu tư liệu sản xuất của xã hội","Giai cấp chiếm số lượng đông đảo trong xã hội","Giai cấp thúc đẩy sự tiến bộ xã hội thông qua hoạt động của mình","Giai cấp tiến bộ của xã hội"],"correct":[0],"page":49},{"id":"3-361","chapter":3,"number":361,"level":"TB","text":"Thực chất của quan hệ biện chứng giữa cơ sở hạ tầng và kiến trúc thượng tầng là:","options":["Quan hệ giữa đời sống vật chất và đời sống tinh thần của xã hội","Quan hệ giữa kinh tế và chính trị","Quan hệ giữa vật chất và tinh thần","Quan hệ giữa tồn tại xã hội với ý thức xã hội"],"correct":[1],"page":49},{"id":"3-362","chapter":3,"number":362,"level":"TB","text":"Cấu trúc của một hình thái kinh tế - xã hội gồm các yếu tố cơ bản:","options":["Lĩnh vực vật chất và lĩnh vực tinh thần","Cơ sở hạ tầng và kiến trúc thượng tầng","Quan hệ sản xuất, lực lượng sản xuất và kiến trúc thượng tầng","Quan hệ sản xuất, cơ sở hạ tầng và kiến trúc thượng tầng"],"correct":[2],"page":49},{"id":"3-363","chapter":3,"number":363,"level":"TB","text":"Nhân tố giữ vai trò quyết định đến quá trình thay thế nhau của các hình thái kinh tế - xã hội trong lịch sử nhân loại là:","options":["Sự tác động của các quy luật khách quan","Sự tác động của các nhân tố chủ quan","Sự tác động của tương quan lực lượng chính trị của các giai cấp, tầng lớp xã hội, truyền thống văn hóa của mỗi cộng đồng người","Sự tác động của tình hình quốc tế đối với tiến trình phát triển của mỗi cộng đồng người trong lịch sử"],"correct":[0],"page":49},{"id":"3-364","chapter":3,"number":364,"level":"TB","text":"Nguồn gốc sâu xa của sự vận động phát triển của xã hội là ở:","options":["Sự phát triển của kiến trúc thượng tầng","Sự phát triển của cơ sở hạ tầng","Sự phát triển của quan hệ sản xuất","Sự phát triển của lực lượng sản xuất"],"correct":[3],"page":49},{"id":"3-365","chapter":3,"number":365,"level":"TB","text":"Tiêu chuẩn khách quan để phân biệt các thời đại kinh tế khác nhau trong lịch sử là:","options":["Kiến trúc thượng tầng","Cơ sở hạ tầng","Quan hệ sản xuất","Lực lượng sản xuất"],"correct":[3],"page":49},{"id":"3-366","chapter":3,"number":366,"level":"TB","text":"Tiêu chuẩn quan trọng nhất để phân biệt bản chất các chế độ xã hội khác nhau trong lịch sử là:","options":["Cơ sở hạ tầng","Quan hệ sản xuất","Kiến trúc thượng tầng","Lực lượng sản xuất"],"correct":[1],"page":50},{"id":"3-367","chapter":3,"number":367,"level":"TB","text":"Hạt nhân của chủ nghĩa duy vật lịch sử là:","options":["Lý luận hình thái kinh tế - xã hội","Quy luật quan hệ sản xuất phù hợp với trình độ phát triển của lực lượng sản xuất.","Biện chứng của cơ sở hạ tầng và kiến trúc thượng tầng","Nguyên lý tồn tại xã hội quyết định ý thức xã hội"],"correct":[0],"page":50},{"id":"3-368","chapter":3,"number":368,"level":"TB","text":"Điều kiện cho sự phát triển “bỏ qua” một hay một vài hình thái kinh tế - xã hội nhất định trong lịch sử:","options":["Điều kiện khách quan nhất định","Điều kiện chủ quan nhất định","Điều kiện khách quan của thời đại và nhân tố chủ quan của mỗi quốc gia, dân tộc","Theo ý muốn của giai cấp thống trị xã hội"],"correct":[2],"page":50},{"id":"3-369","chapter":3,"number":369,"level":"TB","text":"Thực chất của sự phân hóa những con người trong một cộng đồng xã hội thành các giai cấp khác nhau, đối lập nhau là:","options":["Do mức sống (mức thu nhập) khác nhau","Do có sự khác nhau và đối lập nhau về địa vị của họ trong một chế độ kinh tế - xã hội nhất định","Do nghề nghiệp và sở thích khác nhau","Do có màu da, sắc tộc khác nhau"],"correct":[1],"page":50},{"id":"3-370","chapter":3,"number":370,"level":"TB","text":"Nguyên nhân sâu xa của sự phân hóa giai cấp trong xã hội là:","options":["Do tình trạng phát triển của lực lượng sản xuất làm cho năng xuất lao động tăng lên, xuất hiện “của dư”","Do sự ra đời và tồn tại của chế độ chiếm hữu tư nhân về tư liệu sản xuất, đặc biệt là đối với tư liệu sản xuất chủ yếu của xã hội","Do sự tác động của nhân tố bạo lực","Do sự tác động của các quy luật kinh tế phân hóa những người sản xuất hàng hóa trong nội bộ cộng đồng xã hội"],"correct":[0],"page":50},{"id":"3-371","chapter":3,"number":371,"level":"TB","text":"Nguyên nhân trực tiếp dẫn đến sự ra đời của giai cấp trong xã hội là:","options":["Xã hội xuất hiện chế độ tư hữu về tư liệu sản xuất","Do mức sống, mức thu nhập khác nhau","Sự phát triển của lực lượng sản xuất","Sự phát triển của công cụ lao động"],"correct":[0],"page":50},{"id":"3-372","chapter":3,"number":372,"level":"TB","text":"Sự phân chia một xã hội thành giai cấp trước hết là do:","options":["Nguyên nhân kinh tế","Nguyên nhân chính trị","Nguyên nhân tâm lý","Nguyên nhân tư tưởng"],"correct":[0],"page":50},{"id":"3-373","chapter":3,"number":373,"level":"TB","text":"Sự khác nhau về địa vị của những tập đoàn người to lớn trong một hệ thống sản xuất xã hội nhất định trong lịch sử là do:","options":["Khác nhau về vai trò của họ trong tổ chức lao động xã hội và khác nhau về cách thức hưởng thụ và phần của cải xã hội ít hoặc nhiều mà họ được hưởng","Khác nhau về quan hệ của họ trong xã hội; khác nhau về vai trò của họ trong tổ chức lao động xã hội và khác nhau về cách thức hưởng thụ và phần của cải xã hội ít hoặc nhiều mà họ được hưởng","Khác nhau về vai trò trong sản xuất; khác nhau về vai trò của họ trong tổ chức lao động xã hội và khác nhau về cách thức hưởng thụ và phần của cải xã hội ít hoặc nhiều mà họ được hưởng","Khác nhau về quan hệ của họ đối với tư liệu sản xuất; khác nhau về vai trò của họ trong tổ chức lao động xã hội và khác nhau về cách thức hưởng thụ và phần của cải xã hội ít hoặc nhiều mà họ được hưởng"],"correct":[3],"page":50},{"id":"3-374","chapter":3,"number":374,"level":"TB","text":"Đặc trưng cơ bản nhất quyết định địa vị của những tập đoàn người to lớn trong một hệ thống sản xuất xã hội nhất định trong lịch sử là:","options":["Quan hệ của họ đối với tư liệu sản xuất","Vai trò của họ trong tổ chức lao động xã hội","Cách thức hưởng thụ và phần của cải xã hội ít hoặc nhiều mà họ được hưởng","Các đặc trưng có vai trò như nhau"],"correct":[0],"page":51},{"id":"3-375","chapter":3,"number":375,"level":"TB","text":"Kết cấu xã hội - giai cấp trong xã hội có giai cấp thường gồm:","options":["Các giai cấp cơ bản và các tầng lớp trung gian","Các giai cấp cơ bản và các giai cấp không cơ bản","Hai giai cấp cơ bản, những giai cấp không cơ bản và các tầng lớp trung gian","Các giai cấp đối kháng trong xã hội"],"correct":[2],"page":51},{"id":"3-376","chapter":3,"number":376,"level":"TB","text":"Cơ sở để xác định các giai cấp theo quan điểm của triết học Mác - Lênin:","options":["Quan hệ sản xuất","Lực lượng sản xuất","Phương thức sản xuất","Cơ sở hạ tầng"],"correct":[0],"page":51},{"id":"3-377","chapter":3,"number":377,"level":"TB","text":"Mâu thuẫn đối kháng giữa các giai cấp là do:","options":["Sự khác nhau về tư tưởng, lối sống.","Sự đối lập về lợi ích cơ bản - lợi ích kinh tế.","Sự khác nhau giữa giàu và nghèo.","Sự khác nhau về mức thu nhập."],"correct":[1],"page":51},{"id":"3-378","chapter":3,"number":378,"level":"TB","text":"Các cuộc đấu tranh giai cấp trong xã hội được biểu hiện dưới hình thức:","options":["Đấu tranh kinh tế; đấu tranh chính trị, tư tưởng; đấu tranh dân tộc, tôn giáo, văn hóa","Đấu tranh kinh tế; đấu tranh chính trị; đấu tranh dân tộc","Đấu tranh giai cấp; đấu tranh chính trị; đấu tranh tư tưởng","Đấu tranh tư tưởng; đấu tranh chính trị; đấu tranh dân tộc"],"correct":[0],"page":51},{"id":"3-379","chapter":3,"number":379,"level":"TB","text":"Đấu tranh giai cấp là tất yếu khách quan vì:","options":["Do những mâu thuẫn không thể điều hòa được giữa giai cấp thống trị và giai cấp bị trị","Do lịch sử phát triển của nền sản xuất xã hội","Do nhu cầu tiêu dùng của con người tăng","Do công cụ lao động phát triển"],"correct":[0],"page":51},{"id":"3-380","chapter":3,"number":380,"level":"TB","text":"Vấn đề trung tâm và cơ bản của cuộc đấu tranh giai cấp trong xã hội là:","options":["Giành lấy tư liệu sản xuất","Chiếm giữ quyền lực nhà nước","Chiếm giữ quyền lực kinh tế","Giành lấy vị trí trong sản xuất"],"correct":[1],"page":51},{"id":"3-381","chapter":3,"number":381,"level":"TB","text":"Đấu tranh giai cấp, xét đến cùng là nhằm:","options":["Phát triển sản xuất","Giải quyết mâu thuẫn giai cấp","Lật đổ sự áp bức của giai cấp thống trị bóc lột","Giành lấy chính quyền nhà nước"],"correct":[0],"page":52},{"id":"3-382","chapter":3,"number":382,"level":"TB","text":"Vai trò của đấu tranh giai cấp trong lịch sử nhân loại:","options":["Là động lực cơ bản của sự phát triển xã hội","Là một động lực cơ bản của sự phát triển xã hội trong điều kiện xã hội có phân hóa thành đối kháng giai cấp","Thay thế các hình thái kinh tế- xã hội từ thấp đến cao","Lật đổ ách thống trị của giai cấp thống trị"],"correct":[1],"page":52},{"id":"3-383","chapter":3,"number":383,"level":"TB","text":"Mâu thuẫn đối kháng giữa các giai cấp là do:","options":["Sự khác nhau về tư tưởng, lối sống","Sự đối lập về lợi ích căn bản - lợi ích kinh tế","Sự khác nhau giữa giàu và nghèo","Sự khác nhau về mức thu nhập"],"correct":[1],"page":52},{"id":"3-384","chapter":3,"number":384,"level":"TB","text":"Trong đấu tranh giai cấp, liên minh giai cấp là vấn đề có ý nghĩa:","options":["Cực kỳ quan trọng","Quan trọng","Không quan trọng","Không có vai trò gì"],"correct":[0],"page":52},{"id":"3-385","chapter":3,"number":385,"level":"TB","text":"Trong đấu tranh giai cấp, cơ sở của liên minh giai cấp là:","options":["Sự thống nhất về lợi ích kinh tế","Sự thống nhất về lợi ích vật chất","Sự thống nhất về lợi ích chính trị","Sự thống nhất về lợi ích cơ bản"],"correct":[3],"page":52},{"id":"3-386","chapter":3,"number":386,"level":"TB","text":"Cuộc đấu tranh giai cấp của giai cấp vô sản được chia thành những giai đoạn:","options":["Giai đoạn trước khi giành chính quyền","Giai đoạn sau khi giành chính quyền","Giai đoạn trước khi giành chính quyền và sau khi giành chính chính quyền","Giai đoạn chuẩn bị cho cuộc đấu tranh và giai đoạn xây dựng chính trị"],"correct":[2],"page":52},{"id":"3-387","chapter":3,"number":387,"level":"TB","text":"Khi chưa giành được chính quyền, cuộc đấu tranh giai cấp của giai cấp vô sản gồm những hình thức:","options":["Đấu tranh kinh tế, đấu tranh chính trị, đấu tranh tư tưởng","Đấu tranh giai cấp và đấu tranh chính trị - xã hội","Đấu tranh dân tộc, đấu tranh chính trị, đấu tranh tư tưởng","Đấu tranh kinh tế, đấu tranh xã hội, đấu tranh tư tưởng"],"correct":[0],"page":52},{"id":"3-388","chapter":3,"number":388,"level":"TB","text":"Giai cấp - dân tộc với nhân loại có:","options":["Mối quan hệ lợi ích","Mối quan hệ sâu sắc","Mối quan hệ biện chứng","Mối quan hệ cộng hưởng"],"correct":[2],"page":52},{"id":"3-389","chapter":3,"number":389,"level":"TB","text":"Sự ra đời và tồn tại của nhà nước là do:","options":["Kết quả của cuộc đấu tranh giai cấp trong xã hội có đối kháng giai cấp","Mong muốn của quần chúng nhân dân lao động","Ý muốn chủ quan của giai cấp thống trị xã hội","Là nguyện vọng của mỗi quốc gia dân tộc"],"correct":[0],"page":52},{"id":"3-390","chapter":3,"number":390,"level":"TB","text":"Bản chất của nhà nước là:","options":["Lực lượng điều hòa sự xung đột giai cấp","Lực lượng bảo vệ quyền lợi cho mọi giai cấp, tầng lớp xã hội","Bộ máy của một giai cấp này dùng để trấn áp một giai cấp khác","Bộ máy quản lý những hoạt động chung vì sự tồn tại của xã hội"],"correct":[2],"page":53},{"id":"3-391","chapter":3,"number":391,"level":"TB","text":"Kiểu nhà nước được V.I.Lênin gọi là nhà nước “nửa nhà nước”, “nhà nước không còn nguyên nghĩa” là:","options":["Nhà nước chủ nô","Nhà nước phong kiến","Nhà nước tư sản","Nhà nước vô sản"],"correct":[3],"page":53},{"id":"3-392","chapter":3,"number":392,"level":"TB","text":"Nhà nước đầu tiên trong lịch sử là kiểu nhà nước:","options":["Nhà nước chủ nô quý tộc","Nhà nước vô sản","Nhà nước phong kiến","Nhà nước tư sản"],"correct":[0],"page":53},{"id":"3-393","chapter":3,"number":393,"level":"TB","text":"Về bản chất, nhà nước là:","options":["Một bộ máy tổ chức quyền lực và thực thi quyền lực đặc biệt của xã hội trong điều kiện xã hội có đối kháng giai cấp","Hệ thống tổ chức đại biểu cho quyền lực chung của xã hội để quản lý, điều khiển mọi hoạt động của xã hội và công dân","Một thiết chế quyền lực trong hệ thống kiến trúc thượng tầng của xã hội","Một tổ chức chính trị của giai cấp thống trị về mặt kinh tế nhằm bảo vệ trật tự hiện hành và đàn áp sự phản kháng của các giai cấp khác"],"correct":[3],"page":53},{"id":"3-394","chapter":3,"number":394,"level":"TB","text":"Nhà nước là của:","options":["Các tầng lớp trong xã hội","Giai cấp thống trị về kinh tế","Giai cấp bị thống trị","Các giai cấp cơ bản và không cơ bản"],"correct":[1],"page":53},{"id":"3-395","chapter":3,"number":395,"level":"TB","text":"Nhà nước có:","options":["Hai đặc trưng cơ bản","Ba đặc trưng cơ bản","Bốn đặc trưng cơ bản","Năm đặc trưng cơ bản"],"correct":[1],"page":53},{"id":"3-396","chapter":3,"number":396,"level":"TB","text":"Cách mạng xã hội là:","options":["Sự thay đổi thể chế chính trị này bằng thể chế chính trị khác","Sự thay đổi thể chế kinh tế này bằng thể chế kinh tế khác","Phương thức chuyển từ một hình thái kinh tế - xã hội lỗi thời lên hình thái kinh tế - xã hội mới có trình độ phát triển cao hơn","Sự biến tranh giành quyền lực nhà nước giữa các lực lượng chính trị với chủ trương không thay đổi chế độ hiện thời"],"correct":[2],"page":53},{"id":"3-397","chapter":3,"number":397,"level":"TB","text":"Nguyên nhân sâu xa nhất của cách mạng xã hội là:","options":["Nguyên nhân chính trị","Nguyên nhân kinh tế","Nguyên nhân tư tưởng","Nguyên nhân tâm lý"],"correct":[1],"page":53},{"id":"3-398","chapter":3,"number":398,"level":"TB","text":"Quan điểm của chủ nghĩa duy vật lịch sử:","options":["Giành chính quyền không phải là vấn đề cơ bản của mọi cuộc cách mạng xã hội","Cách mạng xã hội là bước chuyển vĩ đại đời sống xã hội về kinh tế","Cách mạng xã hội là phương thức thay thế từ hình thái kinh tế - xã hội này sang hình thái kinh tế - xã hội khác cao hơn","Cách mạng xã hội không phải là đỉnh cao của cuộc đấu tranh giai cấp"],"correct":[2],"page":54},{"id":"3-399","chapter":3,"number":399,"level":"TB","text":"Kết quả cuối cùng của những cuộc cách mạng xã hội - đỉnh cao của những cuộc đấu tranh giai cấp trong lịch sử nhân loại:","options":["Sự ra đời của lực lượng sản xuất mới","Sự ra đời của quan hệ sản xuất mới","Sự ra đời của phương thức sản xuất mới","Sự ra đời của chế độ xã hội mới"],"correct":[2],"page":54},{"id":"3-400","chapter":3,"number":400,"level":"TB","text":"Vai trò của cách mạng xã hội đối với sự phát triển của xã hội có đối kháng giai cấp:","options":["Là động lực duy nhất của sự phát triển xã hội","Là một trong những phương thức, động lực của sự phát triển xã hội","Là khuynh hướng chung của sự phát triển xã hội","Là cơ chế để thay đổi chính quyền nhà nước"],"correct":[1],"page":54},{"id":"3-401","chapter":3,"number":401,"level":"TB","text":"Mục tiêu của cách mạng Việt Nam:","options":["Giải phóng dân tộc và giải phóng giai cấp","Lật đổ xã hội phong kiến và đánh đuổi đế quốc xâm lược","Độc lập dân tộc gắn liền với chủ nghĩa xã hội","Giành độc lập dân tộc và tiến lên chủ nghĩa cộng sản"],"correct":[2],"page":54},{"id":"3-402","chapter":3,"number":402,"level":"TB","text":"“Bản chất của Nhà nước pháp quyền xã hội chủ nghĩa Việt Nam” là:","options":["Nhà nước của các giai cấp","Nhà nước của giai cấp công nhân","Nhà nước của nhân dân, do nhân dân và vì nhân dân","Nhà nước của giai cấp nông dân"],"correct":[2],"page":54},{"id":"3-403","chapter":3,"number":403,"level":"TB","text":"Đường lối, quan điểm của Đảng Cộng sản Việt Nam là một bộ phận thuộc về:","options":["Lực lượng sản xuất","Quan hệ sản xuất","Cơ sở hạ tầng","Kiến trúc thượng tầng"],"correct":[3],"page":54},{"id":"3-404","chapter":3,"number":404,"level":"TB","text":"Vai trò sáng tạo lịch sử được quyết định bởi:","options":["Các nhà khoa học","Quần chúng nhân dân","Vĩ nhân, lãnh tụ","Không do ai quyết định vì nó diễn ra theo quy luật tự nhiên"],"correct":[1],"page":54},{"id":"3-405","chapter":3,"number":405,"level":"TB","text":"Lực lượng căn bản và chủ chốt của quần chúng nhân dân là:","options":["Những người lao động sản xuất ra của cải vật chất","Những người lao động sản xuất ra giá trị tinh thần","Những người đang hoạt động trong các lĩnh vực khoa học","Những người lao động sản xuất ra của cải vật chất và tinh thần"],"correct":[3],"page":54},{"id":"3-406","chapter":3,"number":406,"level":"TB","text":"Cuộc cách mạng xã hội thứ lần thứ hai trong lịch sử đã thực hiện bước chuyển xã hội từ:","options":["Hình thái kinh tế - xã hội chiếm hữu nô lệ lên hình thái kinh tế - xã hội phong kiến","Hình thái kinh tế - xã hội phong kiến lên hình thái kinh tế - xã hội tư bản tư bản chủ nghĩa","Hình thái kinh tế - xã hội tư bản lên hình thái kinh tế - xã hội cộng sản chủ nghĩa","Hình thái kinh tế - xã hội cộng sản nguyên thủy lên hình thái kinh tế - xã hội chiếm hữu nô lệ"],"correct":[0],"page":55},{"id":"3-407","chapter":3,"number":407,"level":"TB","text":"Phạm trù hình thái kinh tế - xã hội đã chỉ rõ động lực phát triển của lịch sử xã hội là:","options":["Do lực lượng siêu nhiên thần bí chi phối","Do lực lượng tinh thần chi phối","Do lực lượng tinh thần và lực lượng siêu nhiên bên ngoài con người","Do hoạt động thực tiễn của con người mà trước hết là thực tiễn sản xuất vật chất"],"correct":[3],"page":55},{"id":"3-408","chapter":3,"number":408,"level":"TB","text":"Giữa lãnh tụ và quần chúng nhân dân có mối quan hệ:","options":["Quan hệ chi phối","Quan hệ thống nhất biện chứng","Quan hệ phụ thuộc","Quan hệ lợi ích"],"correct":[1],"page":55},{"id":"3-409","chapter":3,"number":409,"level":"TB","text":"Khái niệm “tồn tại xã hội” dùng để chỉ:","options":["Phương thức sản xuất của xã hội","Điều kiện kinh tế của xã hội","Toàn bộ sinh hoạt vật chất và những điều kiện sinh hoạt vật chất của xã hội","Dân số và mật độ dân cư"],"correct":[2],"page":55},{"id":"3-410","chapter":3,"number":410,"level":"TB","text":"C.Mác viết:“cái cối xay quay bằng tay đưa lại xã hội có lãnh chúa phong kiến, cái cối xay chạy bằng hơi nước đưa lại xã hội tư bản công nghiệp”. Câu nói trên phản ánh:","options":["Vai trò quyết định của quan hệ sản xuất đối với lực lượng sản xuất","Vai trò quyết định của lực lượng sản xuất đối với quan hệ sản xuất","Lực lượng sản xuất và quan hệ sản xuất tồn tại độc lập","Lực lượng sản xuất và quan hệ sản xuất tồn tại mâu thuẫn với nhau"],"correct":[1],"page":55},{"id":"3-411","chapter":3,"number":411,"level":"TB","text":"Các yếu tố cấu thành tồn tại xã hội bao gồm:","options":["Phương thức sản xuất; điều kiện tự nhiên và hoàn cảnh địa lý; dân số và mật độ dân cư","Điều kiện tự nhiên và hoàn cảnh địa lý; dân số và mật độ dân cư","Phương thức sản xuất, dân số và mật độ dân cư","Phương thức sản xuất; điều kiện tự nhiên và hoàn cảnh địa lý"],"correct":[0],"page":55},{"id":"3-412","chapter":3,"number":412,"level":"TB","text":"Yếu tố đóng vai trò cơ bản nhất trong tồn tại xã hội là:","options":["Phương thức sản xuất","Điều kiện tự nhiên và hoàn cảnh địa lý","Dân số và mật độ dân cư","Lực lượng sản xuất"],"correct":[0],"page":55},{"id":"3-413","chapter":3,"number":413,"level":"TB","text":"Khái niệm “ý thức xã hội” dùng để chỉ:","options":["Mặt tinh thần của đời sống xã hội và là bộ phận hợp thành của văn hóa tinh thần của xã hội","Đời sống tinh thần của xã hội","Ý thức của con người trong xã hội","Đời sống tâm linh của con người"],"correct":[0],"page":55},{"id":"3-414","chapter":3,"number":414,"level":"TB","text":"Các nhà kinh điển của chủ nghĩa Mác - Lênin cho rằng:","options":["Đời sống tinh thần của xã hội hình thành và phát triển đồng thời, độc lập với đời sống vật chất","Đời sống tinh thần của xã hội hình thành và phát triển trên cơ sở của đời sống vật chất","Đời sống tinh thần của xã hội hình thành trước và là cơ sở phát triển của đời sống vật chất","Phải tìm nguồn gốc của tư tưởng, tâm lý xã hội trong bản thân nó, nghĩa là tìm trong đầu óc con người"],"correct":[1],"page":56},{"id":"3-415","chapter":3,"number":415,"level":"TB","text":"Nguyên lý đánh dấu sự đối lập căn bản giữa thế giới quan duy vật và thế giới quan duy tâm về xã hội là:","options":["Nguyên lý vật chất quyết định ý thức","Nguyên lý về mối liên hệ phổ biến","Nguyên lý về sự phát triển","Nguyên lý tồn tại xã hội quyết định ý thức xã hội"],"correct":[3],"page":56},{"id":"3-416","chapter":3,"number":416,"level":"TB","text":"Những tư tưởng, những quan điểm được tổng hợp, được hệ thống hóa và khái quát hóa thành các học thuyết xã hội dưới dạng các khái niệm, các phạm trù và các quy luật, là:","options":["Ý thức chính trị","Ý thức thẩm mỹ","Ý thức lý luận","Ý thức kinh nghiệm"],"correct":[2],"page":56},{"id":"3-417","chapter":3,"number":417,"level":"TB","text":"Ý thức xã hội thông thường:","options":["Phản ánh một cách sinh động và trực tiếp các mặt khác nhau của cuộc sống hàng ngày của con người","Phản ánh sâu sắc, chính xác, bao quát","Phản ánh vẻ bề ngoài","Phản ánh nội dung đời sống xã hội"],"correct":[0],"page":56},{"id":"3-418","chapter":3,"number":418,"level":"TB","text":"Ý thức lý luận phản ánh hiện thực khách quan:","options":["Phản ánh một cách sinh động và trực tiếp","Phản ánh sâu sắc, chính xác, bao quát và vạch ra được những mối liên hệ khách quan, bản chất, tất yếu mang tính quy luật","Phản ánh vẻ bề ngoài","Phản ánh nội dung đời sống xã hội"],"correct":[1],"page":56},{"id":"3-419","chapter":3,"number":419,"level":"TB","text":"Phạm trù hình thái kinh tế - xã hội là phạm trù được áp dụng:","options":["Cho mọi xã hội trong lịch sử","Cho xã hội cộng sản chủ nghĩa","Cho xã hội tư bản chủ nghĩa","Cho xã hội phong kiến"],"correct":[0],"page":56},{"id":"3-420","chapter":3,"number":420,"level":"TB","text":"Hình thái ý thức chính trị xuất hiện:","options":["Trong xã hội có giai cấp và có nhà nước","Trong xã hội cộng sản nguyên thủy","Trong xã hội thị tộc, bộ lạc","Trong xã hội tư bản chủ nghĩa"],"correct":[0],"page":56},{"id":"3-421","chapter":3,"number":421,"level":"TB","text":"Đặc điểm phản ánh của tâm lý xã hội:","options":["Phản ánh sinh động, trực tiếp nhiều mặt cuộc sống hàng ngày của con người, thường xuyên chi phối cuộc sống đó","Phản ánh hiện thực khách quan một cách khái quát, sâu sắc và chính xác, vạch ra các mối liên hệ bản chất của sự vật và hiện tượng","Là sự phản ánh một cách trực tiếp và tự phát... cho nên nó chỉ ghi lại những gì nằm trên bề mặt của tồn tại xã hội","Được hình thành một cách tự giác, có khả năng đi sâu vào bản chất các mối quan hệ xã hội"],"correct":[2],"page":57},{"id":"3-422","chapter":3,"number":422,"level":"TB","text":"Đặc điểm của ý thức xã hội thông thường:","options":["Phản ánh sinh động, trực tiếp các mặt khác nhau của cuộc sống hàng ngày của con người","Phản ánh hiện thực khách quan một cách khái quát, sâu sắc và chính xác, vạch ra các mối liên hệ bản chất của sự vật và hiện tượng","Là sự phản ánh có tính chất tự phát, thường ghi lại những mặt bề ngoài của tồn tại xã hội","Được hình thành một cách tự giác, có khả năng đi sâu vào bản chất các mối quan hệ xã hội"],"correct":[0],"page":57},{"id":"3-423","chapter":3,"number":423,"level":"TB","text":"Trong xã hội có giai cấp, ý thức xã hội mang tính giai cấp là do:","options":["Sự truyền bá tư tưởng của giai cấp thống trị","Các giai cấp có quan niệm khác nhau về giá trị","Trình độ nhận thức của các giai cấp không như nhau","Điều kiện sinh hoạt vật chất, địa vị và lợi ích của các giai cấp khác nhau"],"correct":[3],"page":57},{"id":"3-424","chapter":3,"number":424,"level":"TB","text":"Vai trò của ý thức cá nhân đối với ý thức xã hội:","options":["Ý thức cá nhân là phương thức tồn tại và biểu hiện của ý thức xã hội","Tổng số ý thức cá nhân bằng ý thức xã hội","Ý thức cá nhân độc lập với ý thức xã hội","Ý thức cá nhân quyết định ý thức xã hội"],"correct":[0],"page":57},{"id":"3-425","chapter":3,"number":425,"level":"TB","text":"Các tính chất biểu hiện tính độc lập tương đối của ý thức xã hội:","options":["Tính lạc hậu, tính vượt trước","Tính lệ thuộc, tính chất tiên tiến","Tính vượt trước, tính linh hoạt","Tính sáng tạo, tính kế thừa"],"correct":[0],"page":57},{"id":"3-426","chapter":3,"number":426,"level":"TB","text":"Quan điểm, tư tưởng của xã hội là yếu tố thuộc phạm trù:","options":["Kiến trúc thượng tầng","Quan hệ sản xuất","Cơ sở hạ tầng","Tồn tại xã hội"],"correct":[0],"page":57},{"id":"3-427","chapter":3,"number":427,"level":"TB","text":"Theo quan điểm của chủ nghĩa duy vật lịch sử, con người với tư cách là “người”, được bắt đầu bằng tự phân biệt với súc vật ngay khi con người:","options":["Bắt đầu sản xuất ra những tư liệu sinh hoạt của mình","Khi con người có ý thức","Khi con người biết sử dụng lửa để nấu chín thức ăn","Khi con người có ngôn ngữ"],"correct":[0],"page":57},{"id":"3-428","chapter":3,"number":428,"level":"TB","text":"Vai trò của tồn tại xã hội trong quan hệ biện chứng với ý thức xã hội là:","options":["Ý thức xã hội là sự phản ánh tồn tại xã hội, phụ thuộc vào tồn tại xã hội","Tồn tại xã hội quyết định sự biến đổi của ý thức xã hội","Tồn tại xã hội làm thay đổi các hình thái ý th lực lượng sản xuất đòi hỏi:","options":["Tất yếu phải thiết lập chế độ công hữu về tư liệu sản xuất","Thay thế quan hệ sản xuất khác","Giữ nguyên quan hệ sản xuất cũ","Phát triển công cụ sản xuất"],"correct":[0],"page":59},{"id":"3-442","chapter":3,"number":442,"level":"KH","text":"Trong thực tiễn, muốn phát triển kinh tế phải bắt đầu từ:","options":["Con người","Của cải vật chất","Lực lượng sản xuất","Quan hệ sản xuất"],"correct":[2],"page":59},{"id":"3-443","chapter":3,"number":443,"level":"KH","text":"Hiểu vấn đề “bỏ qua” chế độ tư bản chủ nghĩa ở nước ta như thế nào là đúng:","options":["Là sự “phát triển rút ngắn” và “bỏ qua” việc xác lập địa vị thống trị của quan hệ sản xuất và kiến trúc thượng tầng tư bản chủ nghĩa","Là “bỏ qua” sự phát triển lực lượng sản xuất","Là sự phát triển tuần tự","Là bỏ qua tất cả những giá trị nhân loại đã đạt được trong chủ nghĩa tư bản"],"correct":[0],"page":59},{"id":"3-444","chapter":3,"number":444,"level":"KH","text":"Cách viết nào sau đây là đúng:","options":["Hình thái kinh tế - xã hội","Hình thái kinh tế của xã hội","Hình thái xã hội","Hình thái kinh tế, xã hội"],"correct":[0],"page":59},{"id":"3-445","chapter":3,"number":445,"level":"KH","text":"Sự thay đổi căn bản, toàn diện và triệt để một hình thái kinh tế - xã hội này bằng một hình thái kinh tế - xã hội khác là:","options":["Đột biến xã hội","Cách mạng xã hội","Cải cách xã hội","Tiến hóa xã hội"],"correct":[1],"page":59},{"id":"3-446","chapter":3,"number":446,"level":"KH","text":"Cách mạng vô sản là cuộc cách mạng vĩ đại nhất, sâu sắc nhất trong lịch sử nhân loại vì:","options":["Thay thế chế độ bóc lột này bằng chế độ bóc lột khác tinh vi hơn","Làm thay đổi hoàn toàn bản chất chế độ chính trị xã hội cũ, xóa bỏ triệt để nguồn gốc chế độ tư hữu sản sinh đối kháng giai cấp","Làm thay đổi hoàn toàn bản chất chế độ chính trị xã hội cũ","Làm thay đổi vị trí của giai cấp bị thống trị trong xã hội"],"correct":[1],"page":60},{"id":"3-447","chapter":3,"number":447,"level":"KH","text":"Xét đến cùng, vai trò của cách mạng xã hội là:","options":["Phá bỏ xã hội cũ lạc hậu","Giải phóng lực lượng sản xuất","Đưa giai cấp tiến bộ lên địa vị thống trị","Lật đổ chính quyền của giai cấp thống trị"],"correct":[1],"page":60},{"id":"3-448","chapter":3,"number":448,"level":"KH","text":"Vai trò của cách mạng xã hội đối với tiến hóa xã hội:","options":["Cách mạng xã hội mở đường cho quá trình tiến hoá xã hội lên giai đoạn cao hơn","Cách mạng xã hội làm gián đoạn quá trình tiến hoá xã hội","Cách mạng xã hội không có quan hệ với tiến hoá xã hội","Cách mạng xã hội phủ định tiến hoá xã hội"],"correct":[0],"page":60},{"id":"3-449","chapter":3,"number":449,"level":"KH","text":"Điều kiện cơ bản để ý thức xã hội tác động trở lại tồn tại xã hội:","options":["Ý thức xã hội phải phù hợp với tồn tại xã hội","Hoạt động thực tiễn của con người","Điều kiện vật chất bảo đảm","Ý thức xã hội phải “vượt trước” tồn tại xã hội"],"correct":[1],"page":60},{"id":"3-450","chapter":3,"number":450,"level":"KH","text":"Hiện nay, ở nước ta còn tồn tại tư tưởng “trọng nam kinh nữ”, điều đó thể hiện:","options":["Tính lạc hậu của ý thức xã hội","Tính vượt trước của ý thức xã hội","Tính kế thừa của ý thức xã hội","Tính độc lập của ý thức xã hội"],"correct":[0],"page":60}]</script>
<script>
'use strict';
const BANK=JSON.parse(document.getElementById('question-data').textContent);
const VERSION='triethoc-450-v1', PREFIX='triethoc-premium-v1:';
const CHAPTERS={1:'Khái luận về triết học và triết học Mác – Lênin',2:'Chủ nghĩa duy vật biện chứng',3:'Chủ nghĩa duy vật lịch sử'};
const BYID=new Map(BANK.map(q=>[q.id,q]));
const app=document.getElementById('app');let user=null,profile=null,screen='login',tab='practice',active=null,result=null,reviewFilter='all',reviewPage=0,toastTimer,dialogResolve;
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function toast(s){const el=document.getElementById('toast');el.textContent=s;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.hidden=true,5500);}
function read(k,fallback){try{const s=localStorage.getItem(k);return s?JSON.parse(s):fallback;}catch{return fallback;}}
function write(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true;}catch{toast('Không thể lưu dữ liệu. Hãy xuất bản sao lưu; bài vẫn làm được trong phiên này.');return false;}}
function emptyProfile(){return {version:VERSION,history:[],wrong:{},favorites:[],draft:null};}
function validRun(r){return !!r&&r.version===VERSION&&Array.isArray(r.ids)&&r.ids.length>0&&r.ids.length<=450&&new Set(r.ids).size===r.ids.length&&r.ids.every(id=>BYID.has(id))&&r.answers&&typeof r.answers==='object'&&r.ids.every(id=>r.answers[id]==null||(Number.isInteger(r.answers[id])&&r.answers[id]>=0&&r.answers[id]<BYID.get(id).options.length))&&Array.isArray(r.marked)&&Array.isArray(r.locked)&&r.marked.every(id=>r.ids.includes(id))&&r.locked.every(id=>r.ids.includes(id))&&Number.isFinite(r.startedAt)&&Number.isFinite(r.index)&&r.index>=0&&r.index<r.ids.length&&['exam','learn'].includes(r.mode)&&(!r.duration||(Number.isFinite(r.duration)&&r.duration>0));}
function sanitize(p){if(!p||p.version!==VERSION)return emptyProfile();const d=emptyProfile();d.history=Array.isArray(p.history)?p.history.filter(r=>validRun(r)&&Number.isFinite(r.finishedAt)):[];d.favorites=Array.isArray(p.favorites)?[...new Set(p.favorites.filter(id=>BYID.has(id)))]:[];d.wrong={};if(p.wrong&&typeof p.wrong==='object')for(const [id,v] of Object.entries(p.wrong))if(BYID.has(id)&&Number.isFinite(v)&&v>0)d.wrong[id]=v;d.draft=validRun(p.draft)?p.draft:null;return d;}
function save(){if(user&&profile)return write(PREFIX+user,profile);return false;}
function rememberDraft(){if(active){profile.draft=active;save();}}
const rawPrefs=read(PREFIX+'settings',{});const prefs=rawPrefs&&typeof rawPrefs==='object'?rawPrefs:{};let theme=prefs.theme==='light'?'light':'dark',reduced=!!prefs.reduced,fontsize=[16,18,20].includes(prefs.fontsize)?prefs.fontsize:16;
function applyPrefs(){document.body.classList.toggle('light',theme==='light');document.body.classList.toggle('reduced',reduced);document.documentElement.style.setProperty('--size',fontsize+'px');}
function savePrefs(){applyPrefs();write(PREFIX+'settings',{theme,reduced,fontsize});}
applyPrefs();
function btn(label,act,extra='',cls=''){return `<button class="btn ${cls}" data-act="${act}" ${extra}>${label}</button>`;}
function ask(title,body,yes='Xác nhận'){const d=document.getElementById('modal');document.getElementById('modal-title').textContent=title;document.getElementById('modal-body').innerHTML=body;document.getElementById('modal-yes').textContent=yes;d.showModal();return new Promise(resolve=>dialogResolve=resolve);}
function closeModal(ok){document.getElementById('modal').close();if(dialogResolve){dialogResolve(ok);dialogResolve=null;}}
document.getElementById('modal-no').onclick=()=>closeModal(false);document.getElementById('modal-yes').onclick=()=>closeModal(true);document.getElementById('modal').addEventListener('cancel',e=>{e.preventDefault();closeModal(false);});
function header(){return `<header class="top row between"><div class="brand">TRIẾT<span class="muted"> / </span><b>PREMIUM</b></div><div class="row">${user?`<span class="pill"><span class="dot"></span>${esc(user)}</span>`:''}${btn(theme==='dark'?'☀ Sáng':'☾ Tối','theme','aria-label="Đổi giao diện sáng tối"','ghost')}${btn('Hướng dẫn','help','','ghost')}${user?btn('Đăng xuất','logout','','ghost'):''}</div></header>`;}
function footer(){return '<footer class="footer">450 câu · Triết học Mác – Lênin · Học từng chút, vững từng chương.<br>Lịch sử lưu trên thiết bị và trình duyệt hiện tại.</footer>';}
function render(){app.innerHTML=header()+({login:loginView,home:homeView,quiz:quizView,result:resultView,help:helpView}[screen]||homeView)()+footer();updateTimer();}
function loginView(){return `<main class="login"><section><div class="eyebrow">Không gian ôn tập của bạn</div><h1>Trắc nghiệm<br><span class="gradient">triết premium</span></h1><p class="muted">450 câu hỏi. 3 chương kiến thức.<br>Biến mỗi lần làm bài thành một bước tiến.</p><div class="row"><span class="pill">✦ Luyện theo chương</span><span class="pill">↗ Theo dõi điểm số</span><span class="pill">◎ Ôn lại câu sai</span></div></section><section class="card form"><div class="eyebrow">Bắt đầu hành trình</div><h2>Chào bạn trở lại.</h2><p class="muted small">Đăng nhập để làm bài và lưu tiến độ riêng.</p><form id="login-form"><label for="username">Tài khoản</label><input id="username" name="username" placeholder="triethoc-1" autocomplete="username" required spellcheck="false" autocapitalize="none"><label for="password">Mật khẩu</label><div class="pass"><input id="password" name="password" type="password" autocomplete="current-password" required><button type="button" class="btn ghost" data-act="password" aria-label="Hiện mật khẩu">Hiện</button></div><p id="login-error" class="error" role="alert"></p><button class="btn primary wide" type="submit">Đăng nhập & bắt đầu →</button></form><div class="note">Đăng nhập mô phỏng cho lớp học. Lịch sử chỉ lưu trên trình duyệt này; mật khẩu trong file HTML không được bảo mật.</div></section></main>`;}
function totals(){const h=profile.history;const scores=h.map(r=>grade(r).score).filter(x=>x!==null);return {count:h.length,average:scores.length?scores.reduce((a,b)=>a+b,0)/scores.length:null,best:scores.length?Math.max(...scores):null,last:h.length?grade(h[0]).score:null};}
function num(n){return n===null?'—':n.toFixed(2).replace('.',',');}
function metrics(){const t=totals();return `<div class="grid four">${[['Lượt hoàn thành',t.count],['Điểm gần nhất',num(t.last)],['Điểm cao nhất',num(t.best)],['Điểm trung bình',num(t.average)]].map(([l,v])=>`<div class="card metric"><div class="muted">${l}</div><div class="stat">${v}</div></div>`).join('')}</div>`;}
function homeView(){return `<main><section class="hero"><div class="eyebrow">Xin chào, ${esc(user)}</div><h1>Trắc nghiệm<br><span class="gradient">triết premium</span></h1><p class="muted">Chọn một chương để nắm chắc kiến thức, hoặc thử sức với một đề ngẫu nhiên. Mỗi câu trả lời đều giúp bạn tiến bộ.</p><div class="row"><span class="pill"><span class="dot"></span>450 câu trong tài liệu</span><span class="pill">3 chương</span><span class="pill">Thang điểm 10</span></div></section>${metrics()}<nav class="tabs" aria-label="Các mục ôn tập">${[['practice','Làm bài'],['history','Lịch sử của tôi'],['stats','Thống kê'],['saved','Sổ ôn tập'],['settings','Cài đặt']].map(([v,l])=>btn(l,'tab',`data-tab="${v}"`,tab===v?'active':'')).join('')}</nav>${{practice:practiceView,history:historyView,stats:statsView,saved:savedView,settings:settingsView}[tab]()} </main>`;}
function config(){return `<div class="card form"><div class="row between"><h3 style="margin:0">Thiết lập bài làm</h3><span class="pill">Áp dụng cho bài mới</span></div><div class="fieldgrid"><div><label for="count">Số lượng câu</label><select id="count"><option value="50">50 câu</option><option value="100">100 câu</option><option value="all">Tất cả câu</option></select></div><div><label for="mode">Cách học</label><select id="mode"><option value="exam">Thi thử — chấm khi nộp</option><option value="learn">Luyện tập — xem sau xác nhận</option></select></div><div><label for="duration">Thời gian</label><select id="duration"><option value="0">Không giới hạn</option><option value="15">15 phút</option><option value="30">30 phút</option><option value="60">60 phút</option><option value="90">90 phút</option><option value="120">120 phút</option></select></div></div></div>`;}
function practiceView(){const d=profile.draft;return `${d?`<div class="card resume row between"><div><b>Bài làm đang chờ bạn</b><div class="small muted">${esc(d.title)} · ${Object.keys(d.answers).length}/${d.ids.length} câu đã chọn</div></div>${btn('Tiếp tục →','resume','','mint')}</div>`:''}${config()}<h2 class="section-title">Làm bài trắc nghiệm theo chương</h2><div class="grid three">${[1,2,3].map(c=>`<section class="card chapter"><div class="n">0${c}</div><div class="eyebrow">Chương ${c}</div><h3>${CHAPTERS[c]}</h3><p class="muted small">${BANK.filter(q=>q.chapter===c).length} câu · Theo đúng phân chương PDF</p>${btn('Làm chương này →','start',`data-source="chapter" data-chapter="${c}"`,'wide')}</section>`).join('')}</div><div class="grid two section-title"><section class="card"><div class="eyebrow">Trộn toàn bộ ngân hàng</div><h2>Làm bài ngẫu nhiên</h2><p class="muted">Kết hợp kiến thức cả ba chương. Mỗi đề được trộn mới và không lặp câu.</p>${btn('Tạo đề ngẫu nhiên ↗','start','data-source="random"','primary')}</section><section class="card"><div class="eyebrow">Một thói quen nhỏ</div><h2>10 câu mỗi ngày</h2><p class="muted">Một bộ câu cố định trong ngày cho cả lớp. Làm một lượt để giữ nhịp ôn tập.</p>${btn('Thử thách hôm nay ✦','start','data-source="daily"')}</section></div><p class="note">Lưu ý dữ liệu: câu 440, Chương 3 (trang 59 PDF) không có đáp án đánh dấu đỏ. Câu này vẫn xuất hiện để ôn tập nhưng không tính vào mẫu số chấm điểm. Ngân hàng có 449 câu đủ đáp án.</p>`;}
function dateStr(t){return new Date(t).toLocaleString('vi-VN');}
function timeStr(ms){const s=Math.max(0,Math.floor(ms/1000));return `${String(Math.floor(s/3600)).padStart(2,'0')}:${String(Math.floor(s/60)%60).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;}
function grade(r){let right=0,wrong=0,blank=0,unknown=0;for(const id of r.ids){const q=BYID.get(id);if(q.correct.length!==1){unknown++;continue;}const a=r.answers[id];if(a==null)blank++;else if(a===q.correct[0])right++;else wrong++;}const total=right+wrong+blank;return {right,wrong,blank,unknown,total,score:total?right/total*10:null};}
function historyView(){return `<div class="row between section-title"><h2 style="margin:0">Lịch sử của tôi</h2><select id="history-filter" aria-label="Lọc lịch sử"><option value="all">Tất cả chương</option><option value="1">Chương 1</option><option value="2">Chương 2</option><option value="3">Chương 3</option><option value="mixed">Đề tổng hợp</option></select></div><div id="history-list">${historyList('all')}</div>`;}
function historyList(filter){const h=profile.history.filter(r=>filter==='all'||(filter==='mixed'?r.source!=='chapter':r.source==='chapter'&&r.chapter===+filter));return h.length?h.map(r=>{const g=grade(r);return `<article class="card history row between"><div><b>${esc(r.title)}</b><div class="muted small">${dateStr(r.finishedAt)} · ${r.ids.length} câu · ${r.mode==='exam'?'Thi thử':'Luyện tập'}</div><div class="small muted">Đúng ${g.right}/${g.total} câu chấm điểm · ${timeStr(r.finishedAt-r.startedAt)}</div></div><div class="row"><div class="stat">${num(g.score)}<span class="muted small"> /10</span></div>${btn('Xem bài','view-result',`data-id="${esc(r.runId)}"`)}</div></article>`;}).join(''):'<div class="card empty">Chưa có lượt làm bài trong mục này.</div>';}
function statsView(){return `<h2 class="section-title">Bạn đang tiến bộ ở đâu?</h2><div class="grid three">${[1,2,3].map(c=>{let total=0,right=0;for(const r of profile.history)for(const id of r.ids){const q=BYID.get(id);if(q.chapter===c&&q.correct.length===1){total++;if(r.answers[id]===q.correct[0])right++;}}const pct=total?Math.round(right/total*100):0;return `<section class="card"><div class="eyebrow">Chương ${c}</div><h3>${CHAPTERS[c]}</h3><div class="stat">${total?pct+'%':'—'}</div><div class="meter"><div style="width:${pct}%"></div></div><p class="small muted">${total?`${right}/${total} lượt câu trả lời đúng (kể cả câu lặp ở các đề).`:'Chưa có dữ liệu.'}</p><span class="pill">${total?(pct<70?'Nên dành thêm thời gian ôn':'Tiếp tục giữ nhịp học'):'Hãy thử một bài đầu tiên'}</span></section>`;}).join('')}</div><div class="card section-title"><h3>Nhịp học 7 ngày gần nhất</h3><div class="row">${Array.from({length:7},(_,i)=>{const day=new Date();day.setDate(day.getDate()-(6-i));const key=localDay(day);const n=profile.history.filter(r=>localDay(new Date(r.finishedAt))===key).length;return `<span class="pill">${day.getDate()}/${day.getMonth()+1}: ${n} lượt ${n?'✓':''}</span>`;}).join('')}</div><p class="muted small" style="margin:15px 0 0">Thống kê dựa trên lịch sử được lưu cho tài khoản này.</p></div>`;}
function savedView(){return `<h2 class="section-title">Sổ ôn tập cá nhân</h2>${config()}<div class="grid two section-title"><section class="card"><div class="eyebrow">Củng cố điểm yếu</div><h2>${Object.keys(profile.wrong).length} câu từng làm sai</h2><p class="muted">Ưu tiên những câu bạn sai nhiều lần. Có thể ôn toàn bộ hoặc theo chương.</p><select id="wrong-chapter" aria-label="Lọc sổ câu sai"><option value="0">Tất cả chương</option>${[1,2,3].map(c=>`<option value="${c}">Chương ${c}</option>`).join('')}</select><div style="margin-top:16px">${btn('Luyện lại câu sai','start','data-source="wrong"','primary')}</div></section><section class="card"><div class="eyebrow">Giữ lại điều cần nhớ</div><h2>${profile.favorites.length} câu yêu thích</h2><p class="muted">Nhấn ngôi sao khi làm hoặc xem lại bài để thêm câu vào bộ ôn riêng.</p>${btn('Ôn câu yêu thích','start','data-source="favorites"')}</section></div><p class="muted small">Sổ câu sai giữ những câu đã từng trả lời sai. Lượt làm đúng sau đó vẫn được ghi trong lịch sử.</p>`;}
function settingsView(){return `<h2 class="section-title">Không gian học của bạn</h2><div class="grid two"><section class="card form"><h3>Hiển thị</h3><label for="font-size">Cỡ chữ</label><select id="font-size"><option value="16" ${fontsize===16?'selected':''}>Tiêu chuẩn</option><option value="18" ${fontsize===18?'selected':''}>Lớn</option><option value="20" ${fontsize===20?'selected':''}>Rất lớn</option></select><label class="check"><input id="reduce-motion" type="checkbox" ${reduced?'checked':''}>Giảm hiệu ứng chuyển động</label><p class="muted small">Thiết lập giảm chuyển động của thiết bị cũng được tôn trọng.</p></section><section class="card"><h3>Dữ liệu cá nhân</h3><p class="muted small">Xuất bản sao lưu để giữ lịch sử, bài đang làm và sổ ôn tập. Có thể nhập lại trên trình duyệt khác bằng cùng tài khoản.</p><div class="row">${btn('Xuất sao lưu','export')}${btn('Nhập sao lưu','import')}</div><input id="import-file" type="file" accept="application/json,.json" hidden><div style="margin-top:22px">${btn('Xóa dữ liệu tài khoản này','clear','','danger ghost')}</div></section></div>`;}
function shuffled(a,random=Math.random){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function localDay(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function seeded(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619);}return ()=>{h+=0x6D2B79F5;let t=Math.imul(h^h>>>15,1|h);t^=t+Math.imul(t^t>>>7,61|t);return ((t^t>>>14)>>>0)/4294967296;};}
function buildRun(source,chapter,count,mode,duration){let pool=BANK,title='Đề ngẫu nhiên · Cả 3 chương';if(source==='chapter'){pool=BANK.filter(q=>q.chapter===chapter);title=`Chương ${chapter} · ${CHAPTERS[chapter]}`;}if(source==='wrong'){pool=BANK.filter(q=>profile.wrong[q.id]&&(!chapter||q.chapter===chapter));title=`Luyện lại câu sai${chapter?' · Chương '+chapter:''}`;}if(source==='favorites'){pool=BANK.filter(q=>profile.favorites.includes(q.id));title='Bộ câu yêu thích';}if(source==='daily'){title='10 câu mỗi ngày · '+localDay();count=10;}const n=count==='all'?pool.length:Math.min(+count,pool.length);let chosen=shuffled(pool,source==='daily'?seeded(localDay()):Math.random);if(source==='wrong')chosen.sort((a,b)=>profile.wrong[b.id]-profile.wrong[a.id]);return {version:VERSION,runId:Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10),source,chapter,title,ids:chosen.slice(0,n).map(q=>q.id),answers:{},marked:[],locked:[],index:0,mode,duration,startedAt:Date.now()};}
async function start(ds){const chapter=ds.source==='wrong'?+(document.getElementById('wrong-chapter')?.value||0):+(ds.chapter||0);const count=document.getElementById('count')?.value||'50',mode=document.getElementById('mode')?.value||'exam',duration=+(document.getElementById('duration')?.value||0)*60000;const r=buildRun(ds.source,chapter,count,mode,duration);if(!r.ids.length){toast('Bộ câu này đang trống. Hãy làm bài hoặc lưu câu yêu thích trước.');return;}const g=grade(r);if(!await ask(r.title,`<p>Bài gồm <b>${r.ids.length} câu</b> · ${mode==='exam'?'Thi thử':'Luyện tập'}.</p><p class="muted">${duration?'Thời gian '+duration/60000+' phút; hết giờ sẽ tự nộp, kể cả khi bạn đóng trang.':'Không giới hạn thời gian. Thời gian làm tính từ lúc bắt đầu.'}</p>${g.unknown?'<p class="note">Có 1 câu chưa có đáp án gốc; bài được chấm trên '+g.total+' câu đủ đáp án.</p>':''}${profile.draft?'<p class="note">Bắt đầu đề mới sẽ thay bài đang làm dở.</p>':''}`,'Bắt đầu làm bài'))return;r.startedAt=Date.now();active=r;profile.draft=r;save();screen='quiz';render();window.scrollTo(0,0);}
function favoriteButton(id){return btn(profile.favorites.includes(id)?'★ Đã lưu':'☆ Lưu câu','favorite',`data-id="${id}"`,'ghost');}
function optionView(q,r,reveal=false){return q.options.map((o,i)=>{const picked=r.answers[q.id]===i,correct=reveal&&q.correct[0]===i,wrong=reveal&&picked&&q.correct.length===1&&!correct;return `<button class="option ${picked?'selected':''} ${correct?'correct':''} ${wrong?'wrong':''}" data-act="answer" data-value="${i}" aria-pressed="${picked}" ${(reveal||r.locked.includes(q.id))?'disabled':''}><span class="letter">${'ABCD'[i]}</span><span>${esc(o)}${correct?'<b class="status"> · ✓ Đáp án đúng</b>':''}${picked?`<b class="small"> · ${wrong?'✕ Bạn chọn':'Bạn chọn'}</b>`:''}</span></button>`;}).join('');}
function feedback(q,r){if(!q.correct.length)return '<p class="note">Câu này chưa có đáp án đánh dấu trong PDF. Câu không tính điểm.</p>';return `<p class="status" style="color:${r.answers[q.id]===q.correct[0]?'var(--mint)':'var(--bad)'}">${r.answers[q.id]===q.correct[0]?'✓ Chính xác.':'✕ Chưa đúng. Đáp án theo dấu đỏ trong tài liệu: '+ 'ABCD'[q.correct[0]]+'.'}</p>`;}
function quizView(){if(!active){screen='home';return homeView();}const r=active,q=BYID.get(r.ids[r.index]),answered=Object.keys(r.answers).length,locked=r.locked.includes(q.id),marked=r.marked.includes(q.id);return `<main><div class="row between"><div><div class="eyebrow">${r.mode==='exam'?'Thi thử':'Luyện tập'} · ${r.ids.length} câu</div><h2>${esc(r.title)}</h2></div>${btn('Lưu & về trang chủ','pause','','ghost')}</div><div class="row between small muted"><span id="quiz-progress-label">Đã chọn ${answered}/${r.ids.length} · Còn ${r.ids.length-answered} câu</span><span>Không lặp câu trong đề</span></div><div class="progress"><div style="width:${answered/r.ids.length*100}%"></div></div><div class="quiz-layout"><section class="card question"><div class="row between"><span class="pill">Câu ${r.index+1}/${r.ids.length} · Chương ${q.chapter} · Câu gốc ${q.number}</span>${favoriteButton(q.id)}</div><h2 id="question-title">${esc(q.text)}</h2>${!q.correct.length?'<p class="note">Chưa có đáp án gốc xác nhận · Không tính điểm</p>':''}<div class="options" role="group" aria-labelledby="question-title">${optionView(q,r,r.mode==='learn'&&locked)}</div>${r.mode==='learn'?(locked?feedback(q,r):`<div style="margin-top:17px">${btn('Xác nhận câu trả lời','lock',r.answers[q.id]==null?'disabled':'','primary')}<p class="muted small" style="margin:9px 0 0">Sau khi xác nhận, đáp án câu này được khóa.</p></div>`):''}<div class="row between qfoot">${btn('← Trước','move',`data-step="-1" ${r.index===0?'disabled':''}`)}${btn(marked?'⚑ Đã đánh dấu':'⚐ Xem lại','mark','','ghost')}${btn('Sau →','move',`data-step="1" ${r.index===r.ids.length-1?'disabled':''}`)}</div><p class="small muted" style="margin:18px 0 0">Phím 1–4 chọn đáp án; ← → chuyển câu.</p></section><aside class="quiz-side"><section class="card"><div class="small muted">${r.duration?'Thời gian còn lại':'Thời gian từ lúc bắt đầu'}</div><div id="timer" class="timer">00:00:00</div><div class="small muted" style="margin:17px 0 9px">Chuyển nhanh đến câu</div><div class="navgrid" aria-label="Điều hướng câu hỏi">${r.ids.map((id,i)=>`<button class="qnum ${r.answers[id]!=null?'answered':''} ${r.index===i?'current':''} ${r.marked.includes(id)?'marked':''}" data-act="jump" data-index="${i}" aria-label="Câu ${i+1}${r.marked.includes(id)?', đã đánh dấu':''}" ${r.index===i?'aria-current="true"':''}>${i+1}</button>`).join('')}</div><p class="small muted" style="margin:14px 0">Tím: đã chọn · Viền xanh: hiện tại<br>Chấm vàng: đánh dấu xem lại</p>${btn('Nộp bài & xem điểm','submit','','primary wide')}</section></aside></div></main>`;}
function updateTimer(){if(!active)return;const el=document.getElementById('timer');if(!el)return;const ms=active.duration?active.startedAt+active.duration-Date.now():Date.now()-active.startedAt;el.textContent=timeStr(ms);el.classList.toggle('urgent',!!active.duration&&ms<60000);if(active.duration&&ms<=0)finish(true);}
async function submit(){const r=active,blank=r.ids.filter(id=>r.answers[id]==null).length,unlocked=r.mode==='learn'?r.ids.filter(id=>r.answers[id]!=null&&!r.locked.includes(id)).length:0;if(await ask('Nộp bài để chấm điểm?',`<p>${blank?`Bạn còn <b>${blank} câu chưa trả lời</b>. Các câu đủ đáp án nhưng bỏ trống được 0 điểm.`:'Bạn đã chọn đáp án cho tất cả các câu.'}</p>${unlocked?`<p class="muted">${unlocked} câu đã chọn nhưng chưa xác nhận sẽ được chấm theo lựa chọn hiện tại.</p>`:''}`,'Nộp bài'))finish(false);}
function finish(timeout=false){if(!active)return;const r=active;active=null;r.finishedAt=timeout?r.startedAt+r.duration:Date.now();r.locked=[...r.ids];r.index=Math.min(r.index,r.ids.length-1);if(!profile.history.some(h=>h.runId===r.runId))profile.history.unshift(r);for(const id of r.ids){const q=BYID.get(id);if(q.correct.length===1&&r.answers[id]!=null&&r.answers[id]!==q.correct[0])profile.wrong[id]=(profile.wrong[id]||0)+1;}profile.draft=null;const saved=save();r.saved=saved;result=r;reviewFilter='all';reviewPage=0;screen='result';if(document.getElementById('modal').open)closeModal(false);render();window.scrollTo(0,0);if(timeout)toast('Đã hết thời gian. Bài được tự động nộp.');if(grade(r).score>=8)confetti();}
function confetti(){if(reduced||window.matchMedia?.('(prefers-reduced-motion: reduce)').matches)return;for(let i=0;i<38;i++){const e=document.createElement('i');e.className='confetti';e.style.left=Math.random()*100+'%';e.style.background=['#a397ff','#69e5c1','#ffd28b','#ff95ac'][i%4];e.style.animationDelay=Math.random()*.5+'s';document.body.append(e);setTimeout(()=>e.remove(),3500);}}
function statusOf(q,r){if(!q.correct.length)return 'unknown';if(r.answers[q.id]==null)return 'blank';return r.answers[q.id]===q.correct[0]?'right':'wrong';}
function resultView(){if(!result)return '<p>Không tìm thấy bài làm.</p>';const r=result,g=grade(r);return `<main><section class="result-head"><div class="eyebrow">${esc(r.title)}</div><h2>Hoàn thành một bước tiến.</h2><div class="score">${num(g.score)}<span> / 10</span></div><p class="muted">${g.score===null?'Bài này chưa có câu đủ đáp án để chấm.':g.score>=8?'Rất tốt! Hãy tiếp tục củng cố kiến thức.':g.score>=5?'Bạn đã có nền tảng. Ôn lại câu sai để tiến bộ hơn.':'Hãy đi từng chương và luyện lại những câu chưa chắc.'}</p><div class="row" style="justify-content:center"><span class="pill">${dateStr(r.finishedAt)}</span><span class="pill">${timeStr(r.finishedAt-r.startedAt)}</span><span class="pill">${r.mode==='exam'?'Thi thử':'Luyện tập'}</span></div></section><div class="grid four">${[['✓ Đúng',g.right],['✕ Sai',g.wrong],['○ Chưa trả lời',g.blank],['Tỷ lệ đúng',g.total?Math.round(g.right/g.total*100)+'%':'—']].map(([l,v])=>`<div class="card metric"><div class="muted">${l}</div><div class="stat">${v}</div></div>`).join('')}</div><p class="muted small" style="margin-top:16px">Điểm = ${g.right}/${g.total} × 10; làm tròn kết quả cuối đến 2 chữ số thập phân.${g.unknown?' Có '+g.unknown+' câu thiếu đáp án gốc không tính điểm.':''} ${r.saved===false?'Kết quả chưa lưu được; hãy xuất sao lưu trong Cài đặt.':'Lịch sử được lưu trên trình duyệt này.'}</p><div class="row section-title">${btn('Luyện câu sai trong bài','retry-wrong','','primary')}${btn('Về trang chủ / Tạo đề mới','home')}${btn('Xuất bản sao lưu','export','','ghost')}</div><div class="row between section-title"><h2 style="margin:0">Xem lại bài làm</h2><select id="review-filter" aria-label="Lọc câu xem lại">${[['all','Tất cả câu'],['right','Câu đúng'],['wrong','Câu sai'],['blank','Chưa trả lời'],['marked','Đã đánh dấu'],['unknown','Chưa có đáp án']].map(([v,l])=>`<option value="${v}" ${reviewFilter===v?'selected':''}>${l}</option>`).join('')}</select></div><div id="review-list">${reviewList()}</div></main>`;}
function reviewList(){const r=result,ids=r.ids.filter(id=>reviewFilter==='all'||(reviewFilter==='marked'?r.marked.includes(id):statusOf(BYID.get(id),r)===reviewFilter));reviewPage=Math.min(reviewPage,Math.max(0,Math.ceil(ids.length/10)-1));return (ids.length?ids.slice(reviewPage*10,reviewPage*10+10).map(id=>{const q=BYID.get(id),s=statusOf(q,r);return `<article class="card review"><div class="row between"><span class="pill">Chương ${q.chapter} · Câu gốc ${q.number} · Trang PDF ${q.page}</span>${favoriteButton(id)}</div><h3 style="margin-top:16px">${esc(q.text)}</h3><p class="small" style="color:${s==='right'?'var(--mint)':s==='wrong'?'var(--bad)':'var(--muted)'}">${{right:'✓ Đúng',wrong:'✕ Sai',blank:'○ Chưa trả lời',unknown:'? Chưa có đáp án gốc — không tính điểm'}[s]}</p>${optionView(q,r,true)}${s==='unknown'?'<p class="note">Không có dấu đỏ cho câu 440 trong PDF. Chưa tự gán đáp án.</p>':''}</article>`;}).join(''):'<div class="card empty">Không có câu nào trong bộ lọc này.</div>')+`<div class="row between section-title">${btn('← Trang trước','review-page',`data-step="-1" ${reviewPage===0?'disabled':''}`)}<span class="small muted">${ids.length} câu · Trang ${ids.length?reviewPage+1:0}/${Math.ceil(ids.length/10)}</span>${btn('Trang sau →','review-page',`data-step="1" ${(reviewPage+1)*10>=ids.length?'disabled':''}`)}</div>`;}
function helpView(){return `<main class="card help"><div class="eyebrow">Sẵn sàng để ôn tập</div><h2>Hướng dẫn sử dụng</h2><ol><li>Đăng nhập bằng <b>triethoc-1</b> đến <b>triethoc-100</b>. Mật khẩu chung: <b>22112007</b>.</li><li>Chọn 50, 100 hoặc tất cả câu, cách học và thời gian; sau đó chọn chương hoặc tạo đề ngẫu nhiên. Nếu chương có ít câu hơn yêu cầu, lấy toàn bộ câu của chương.</li><li>Thi thử chỉ hiện đáp án sau nộp bài. Luyện tập hiện đáp án sau khi bạn xác nhận từng câu và khóa lựa chọn đó.</li><li>Bài được chấm theo thang 10. Câu 440 không có dấu đỏ trong PDF nên không tính điểm. Có 450 câu để ôn, 449 câu chấm được.</li><li>Lịch sử và bài dở lưu riêng theo tài khoản trên trình duyệt. Hãy xuất sao lưu ở Cài đặt trước khi xóa dữ liệu trình duyệt hoặc chuyển thiết bị.</li></ol><h3>Đưa lên GitHub Pages</h3><ol><li>Tạo repository GitHub và tải file này lên với tên chính xác <b>index.html</b> ở thư mục gốc.</li><li>Mở <b>Settings → Pages</b>. Chọn nguồn triển khai từ nhánh (<b>Deploy from a branch</b>), nhánh <b>main</b>, thư mục <b>/(root)</b>, rồi lưu.</li><li>Chờ GitHub hoàn tất triển khai và mở địa chỉ Pages được cung cấp. Repository cần hỗ trợ Pages theo gói tài khoản của bạn.</li></ol><p class="note">Đây là đăng nhập mô phỏng, không có máy chủ xác thực. Người có mã nguồn có thể xem mật khẩu hoặc đáp án; không dùng cho kỳ thi yêu cầu bảo mật.</p>${btn(user?'Về trang chủ':'Về đăng nhập','home','','primary')}</main>`;}
function login(name,password){if(!/^triethoc-([1-9]|[1-9]\d|100)$/.test(name)||password!=='22112007')return false;user=name;profile=sanitize(read(PREFIX+user,null));active=null;result=null;tab='practice';screen='home';try{sessionStorage.setItem(PREFIX+'session',user);}catch{}return true;}
function resume(){if(!validRun(profile.draft)){toast('Bài lưu không còn tương thích. Hãy tạo đề mới.');return;}active=profile.draft;screen='quiz';render();window.scrollTo(0,0);}
function answer(value){if(!active)return;const id=active.ids[active.index];if(active.locked.includes(id))return;active.answers[id]=value;rememberDraft();render();}
function toggleFavorite(id){const i=profile.favorites.indexOf(id);if(i>=0)profile.favorites.splice(i,1);else profile.favorites.push(id);save();render();}
function exportBackup(){if(!user)return;const data=JSON.stringify({version:VERSION,user,exportedAt:new Date().toISOString(),profile},null,2);const url=URL.createObjectURL(new Blob([data],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=user+'-sao-luu-'+localDay()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
async function importBackup(file){if(!file)return;if(file.size>15*1024*1024){toast('File sao lưu quá lớn (giới hạn 15 MB).');return;}try{const b=JSON.parse(await file.text());if(b.user!==user||b.version!==VERSION||!b.profile||!Array.isArray(b.profile.history)||b.profile.history.some(r=>!validRun(r))||(b.profile.draft&&!validRun(b.profile.draft)))throw Error();if(!await ask('Nhập bản sao lưu?',`<p>Thay dữ liệu hiện tại của <b>${esc(user)}</b> bằng bản sao lưu có ${b.profile.history.length} lượt làm. Hãy xuất dữ liệu hiện tại trước nếu muốn giữ.</p>`,'Nhập dữ liệu'))return;profile=sanitize(b.profile);active=null;result=null;save();tab='history';screen='home';render();toast('Đã nhập bản sao lưu.');}catch{toast('File sao lưu không hợp lệ, không tương thích hoặc thuộc tài khoản khác.');}}
const actions={
 theme:()=>{theme=theme==='dark'?'light':'dark';savePrefs();render();},
 password:()=>{const p=document.getElementById('password'),b=document.querySelector('[data-act="password"]');p.type=p.type==='password'?'text':'password';b.textContent=p.type==='password'?'Hiện':'Ẩn';b.setAttribute('aria-label',p.type==='password'?'Hiện mật khẩu':'Ẩn mật khẩu');},
 help:()=>{if(active)rememberDraft();screen='help';render();window.scrollTo(0,0);},
 home:()=>{if(active){rememberDraft();active=null;}screen=user?'home':'login';tab='practice';render();window.scrollTo(0,0);},
 logout:()=>{if(active)rememberDraft();try{sessionStorage.removeItem(PREFIX+'session');}catch{}user=null;profile=null;active=null;result=null;screen='login';render();},
 tab:ds=>{tab=ds.tab;render();},start:ds=>start(ds),resume,
 pause:()=>{rememberDraft();active=null;screen='home';tab='practice';render();},
 answer:ds=>answer(+ds.value),
 move:ds=>{if(!active)return;active.index=Math.max(0,Math.min(active.ids.length-1,active.index+(+ds.step)));rememberDraft();render();},
 jump:ds=>{if(!active)return;active.index=+ds.index;rememberDraft();render();document.getElementById('question-title')?.scrollIntoView({block:'center',behavior:reduced?'auto':'smooth'});},
 lock:()=>{if(!active)return;const id=active.ids[active.index];if(active.answers[id]==null||active.locked.includes(id))return;active.locked.push(id);rememberDraft();render();},
 mark:()=>{if(!active)return;const id=active.ids[active.index],i=active.marked.indexOf(id);if(i<0)active.marked.push(id);else active.marked.splice(i,1);rememberDraft();render();},
 favorite:ds=>toggleFavorite(ds.id),submit,
 'view-result':ds=>{result=profile.history.find(r=>r.runId===ds.id);reviewFilter='all';reviewPage=0;screen='result';render();window.scrollTo(0,0);},
 'review-page':ds=>{reviewPage+=+ds.step;document.getElementById('review-list').innerHTML=reviewList();},
 'retry-wrong':async()=>{const ids=result.ids.filter(id=>statusOf(BYID.get(id),result)==='wrong');if(!ids.length){toast('Bài này không có câu trả lời sai.');return;}if(profile.draft&&!await ask('Thay bài đang làm dở?','<p>Bài luyện lại sẽ thay bài đang lưu.</p>','Bắt đầu'))return;const r=buildRun('wrong',0,'all','learn',0);r.ids=shuffled(ids);r.title='Luyện lại câu sai · '+ids.length+' câu';active=r;profile.draft=r;save();screen='quiz';render();window.scrollTo(0,0);},
 export:exportBackup,import:()=>document.getElementById('import-file').click(),
 clear:async()=>{if(await ask('Xóa dữ liệu tài khoản này?',`<p>Xóa lịch sử, bài dở, câu yêu thích và sổ câu sai của <b>${esc(user)}</b> trên trình duyệt này. Tài khoản khác giữ nguyên dữ liệu.</p>`,'Xóa dữ liệu')){profile=emptyProfile();active=null;result=null;save();render();toast('Đã xóa dữ liệu tài khoản hiện tại.');}}
};
app.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const a=actions[b.dataset.act];if(a)Promise.resolve(a(b.dataset)).catch(()=>toast('Thao tác chưa hoàn tất. Hãy thử lại.'));});
app.addEventListener('submit',e=>{if(e.target.id!=='login-form')return;e.preventDefault();const name=document.getElementById('username').value.trim(),password=document.getElementById('password').value;if(login(name,password)){render();}else document.getElementById('login-error').textContent='Tài khoản hoặc mật khẩu không đúng.';});
app.addEventListener('change',e=>{const el=e.target;if(el.id==='history-filter')document.getElementById('history-list').innerHTML=historyList(el.value);if(el.id==='review-filter'){reviewFilter=el.value;reviewPage=0;document.getElementById('review-list').innerHTML=reviewList();}if(el.id==='font-size'){fontsize=+el.value;savePrefs();}if(el.id==='reduce-motion'){reduced=el.checked;savePrefs();}if(el.id==='import-file')importBackup(el.files[0]);});
document.addEventListener('keydown',e=>{if(screen!=='quiz'||document.getElementById('modal').open||/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)||e.ctrlKey||e.altKey||e.metaKey)return;if(['1','2','3','4'].includes(e.key)){e.preventDefault();answer(+e.key-1);}if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();actions.move({step:e.key==='ArrowRight'?'1':'-1'});}});
window.addEventListener('beforeunload',()=>{if(active)rememberDraft();});setInterval(updateTimer,1000);
try{const previous=sessionStorage.getItem(PREFIX+'session');if(/^triethoc-([1-9]|[1-9]\d|100)$/.test(previous||'')){user=previous;profile=sanitize(read(PREFIX+user,null));screen='home';}}catch{}
render();
</script>
</body></html>
