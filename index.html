,"text":"Để đưa ra một quan niệm thực sự khoa học về vật chất, V. I. Lênin đặc biệt quan tâm đến việc:","options":["Tìm kiếm nội dung để định nghĩa cho phạm trù này và bằng cách đem đối lập với phạm trù ý thức trên phương diện nhận thức luận cơ bản","Tìm kiếm hình thức để định nghĩa cho phạm trù này và bằng cách đem đối lập với phạm trù ý thức trên phương diện bản thể luận cơ bản","Tìm kiếm phương pháp định nghĩa cho phạm trù này (vật chất) và bằng cách đem đối lập với phạm trù ý thức trên phương diện nhận thức luận cơ bản","Tìm kiếm cách thức định nghĩa cho phạm trù này và bằng cách đem đối lập với phạm trù ý thức trên phương diện bản thể luận cơ bản"],"correct":[2],"page":9},{"id":"1-65","chapter":1,"number":65,"level":"KH","text":"Nội dung chủ yếu của bước ngoặt cách mạng trong triết học do C. Mác và Ph. Ăngghen thực hiện là:","options":["Đã vận dụng và mở rộng quan điểm duy vật biện chứng vào nghiên cứu lịch sử xã hội, sáng tạo ra chủ nghĩa duy vật biện chứng","Đã vận dụng và mở rộng quan điểm duy vật biện chứng vào nghiên cứu lịch sử xã hội, sáng tạo ra phép biện chứng duy vật khoa học","Đã vận dụng và mở rộng quan điểm duy vật vào nghiên cứu lịch sử xã hội, sáng tạo ra thế giới quan duy vật biện chứng","Đã vận dụng và mở rộng quan điểm duy vật biện chứng vào nghiên cứu lịch sử xã hội, sáng tạo ra chủ nghĩa duy vật lịch sử"],"correct":[3],"page":9},{"id":"1-66","chapter":1,"number":66,"level":"KH","text":"V.I. Lênin đã kế tục trung thành và phát triển sáng tạo triết học Mác trong thời đại mới là:","options":["Thời đại đế quốc chủ nghĩa và quá độ lên chủ nghĩa xã hội","Thời đại chủ nghĩa tư bản độc quyền","Thời đại đế quốc chủ nghĩa","Thời đại quá độ từ chủ nghĩa tư bản lên chủ nghĩa xã hội"],"correct":[0],"page":9},{"id":"1-67","chapter":1,"number":67,"level":"KH","text":"Triết học Mác ra đời đã chấm dứt tham vọng ở nhiều nhà triết học muốn biến:","options":["Triết học là “duy nhất của lý luận khoa học”","Triết học là “đỉnh cao của tri thức nhân loại”","Triết học là “duy nhất của ý niệm tuyệt đối”","Triết học là “khoa học của mọi khoa học”"],"correct":[3],"page":9},{"id":"1-68","chapter":1,"number":68,"level":"KH","text":"Những phát minh của khoa học tự nhiên nửa đầu thế kỷ XIX đã cung cấp cơ sở tri thức khoa học để phát triển:","options":["Tư duy siêu hình","Tư duy tự phát","Tư duy duy tâm","Tư duy biện chứng"],"correct":[3],"page":9},{"id":"1-69","chapter":1,"number":69,"level":"KH","text":"Triết học Mác là:","options":["Một hệ thống mở luôn luôn được bổ sung, phát triển bởi những thành tựu khoa học và thực tiễn.","Một hệ thống mở luôn luôn được bổ sung, phát triển bởi những nhà nghiên cứu lý luận và thực nghiệm","Một hệ thống lý luận đã hoàn chỉnh không được bổ sung, phát triển bởi những thành tựu khoa học và thực tiễn.","Một hệ thống tư duy luôn luôn được bổ sung, phát triển bởi những tri thức khoa học"],"correct":[0],"page":9},{"id":"1-70","chapter":1,"number":70,"level":"KH","text":"Trong cuộc đấu tranh bảo vệ thành quả của chủ nghĩa xã hội đã đạt được, đưa sự nghiệp xây dựng chủ nghĩa xã hội vượt qua thử thách, tiếp tục tiến lên đòi hỏi:","options":["Chính đảng phải nắm vững lý luận tiên tiến, trước hết là thế giới quan khoa học của nó.","Chính đảng cộng sản nắm vững lý luận chủ nghĩa Mác - Lênin, trước hết là phương pháp luận khoa học của nó.","Các đảng cộng sản càng phải nắm vững lý luận chủ nghĩa Mác - Lênin, trước hết là thế giới quan, phương pháp luận khoa học của nó.","Các đảng cộng sản càng phải nắm vững lý luận chủ nghĩa Mác - Lênin, trước hết là thế giới quan duy vật biện chứng"],"correct":[2],"page":10},{"id":"2-71","chapter":2,"number":71,"level":"DE","text":"Quan niệm về vật chất của Lơxíp và Đêmôcrít là:","options":["Vật chất là nguyên tử","Vật chất là điện tử","Vật chất là vận động","Vật chất là khối lượng"],"correct":[0],"page":10},{"id":"2-72","chapter":2,"number":72,"level":"DE","text":"Điền cụm từ thích hợp để hoàn thiện quan điểm sau:“Vật chất là một phạm trù triết học dùng để chỉ ……. được đem lại cho con người trong cảm giác, được cảm giác của chúng ta ……., và tồn tại không lệ thuộc vào cảm giác”.","options":["Thực tại khách quan - chép lại, chụp lại, phản ánh","Các sự vật, hiện tượng khách quan - chép lại, chụp lại, phản ánh","Thực tại khách quan - nhận thức","Thực tại chủ quan - nhận thức"],"correct":[0],"page":10},{"id":"2-73","chapter":2,"number":73,"level":"DE","text":"Quan điểm của chủ nghĩa duy vật biện chứng về vật chất:","options":["Vật chất là cái mà khi tác động vào các giác quan con người thì đem lại cho con người cảm giác","Vật chất là cái mà khi tác động vào các giác quan con người thì không đem lại cho con người cảm giác","Vật chất là cái không thể tác động vào các giác quan con người để đem lại cho con người cảm giác","Vật chất là cái được sinh ra từ các giác quan con người, do con người tưởng tượng ra"],"correct":[0],"page":10},{"id":"2-74","chapter":2,"number":74,"level":"DE","text":"Quan niệm nào dưới đây không phải của chủ nghĩa duy vật biện chứng:","options":["Vật chất là thực tại khách quan - cái tồn tại hiện thực bên ngoài ý thức và không lệ thuộc vào ý thức","Vật chất là cái mà khi tác động vào các giác quan con người thì đem lại cho con người cảm giác","Vật chất là cái do phức hợp cảm giác của con người tạo thành","Vật chất là cái mà ý thức chẳng qua chỉ là sự phản ánh của nó"],"correct":[2],"page":10},{"id":"2-75","chapter":2,"number":75,"level":"DE","text":"Điền cụm từ thích hợp để hoàn thiện quan điểm sau: “Vận động, hiểu theo nghĩa ………., - tức được hiểu là một phương thức tồn tại của vật chất, là một thuộc tính cố hữu của vật chất, - thì bao gồm ……..… và mọi quá trình diễn ra trong vũ trụ, kể từ sự thay đổi vị trí đơn giản cho đến tư duy”.","options":["Đơn giản - tất cả mọi sự thay đổi","Khái quát - tất cả mọi sự biến đổi","Chung nhất - tất cả mọi sự chuyển biến","Chung nhất - tất cả mọi sự thay đổi"],"correct":[3],"page":10},{"id":"2-76","chapter":2,"number":76,"level":"DE","text":"Quan điểm nào dưới đây không phải của chủ ngh rrect":[3],"page":17},{"id":"2-124","chapter":2,"number":124,"level":"DE","text":"Quan điểm của chủ nghĩa Mác - Lênin, cái đơn nhất là:","options":["Phạm trù triết học dùng để chỉ một sự vật, hiện tượng nhất định","Phạm trù triết học dùng để chỉ mọi sự vật, hiện tượng trong thế giới khách quan","Phạm trù triết học dùng để chỉ những mặt, những thuộc tính chỉ vốn có ở một sự vật, hiện tượng nhất định nào đó mà không lặp lại ở sự vật, hiện tượng nào khác","Phạm trù triết học dùng để chỉ những mặt, những thuộc tính không những có ở một sự vật, hiện tượng nào đó mà còn lặp lại trong nhiều sự vật, hiện tượng khác"],"correct":[2],"page":17},{"id":"2-125","chapter":2,"number":125,"level":"DE","text":"Quan niệm của các nhà triết học duy thực:","options":["Cái chung tồn tại độc lập không phụ thuộc vào cái riêng; còn cái riêng hoặc hoàn toàn không có, hoặc tồn tại phụ thuộc vào cái chung; là cái thứ yếu, tạm thời do cái chung sinh ra","Cái chung không tồn tại thực trong hiện thực khách quan, chỉ có sự vật đơn lẻ, cái riêng mới tồn tại thực","Cái riêng, cái chung, cái đơn nhất đều tồn tại thực; cái riêng tồn tại độc lập; cái chung và cái đơn nhất đều chỉ tồn tại trong cái riêng, như là các mặt của cái riêng","Cái chng và cái đơn nhất có thể chuyển hóa cho nhau"],"correct":[0],"page":17},{"id":"2-126","chapter":2,"number":126,"level":"DE","text":"Quan niệm của các nhà triết học duy danh:","options":["Cái chung tồn tại độc lập không phụ thuộc vào cái riêng; còn cái riêng hoặc hoàn toàn không có, hoặc tồn tại phụ thuộc vào cái chung; là cái thứ yếu, tạm thời do cái chung sinh ra","Cái chung không tồn tại thực trong hiện thực khách quan, chỉ có sự vật đơn lẻ, cái riêng mới tồn tại thực","Cái riêng, cái chung, cái đơn nhất đều tồn tại thực; cái riêng tồn tại độc lập; cái chung và cái đơn nhất đều chỉ tồn tại trong cái riêng, như là các mặt của cái riêng","Không có cái chung và cái riêng nào tồn tại thực, đó chẳng qua chỉ là những sự vật đơn lẻ tồn tại"],"correct":[1],"page":17},{"id":"2-127","chapter":2,"number":127,"level":"DE","text":"Nguyên nhân là phạm trù triết học dùng để chỉ …….… giữa các mặt trong một sự vật, hiện tượng hoặc giữa các sự vật, hiện tượng với nhau gây nên những biến đổi nhất định.","options":["Sự mâu thuẫn","Sự tương tác lẫn nhau","Sự chuyển hóa","Sự thống nhất"],"correct":[1],"page":17},{"id":"2-128","chapter":2,"number":128,"level":"DE","text":"Kết quả là phạm trù triết học dùng để chỉ ……… xuất hiện do sự tương tác giữa các yếu tố mang tính nguyên nhân gây nên.","options":["Những biến đổi","Những thay đổi","Những cái mới","Những sự vật, hiện tượng"],"correct":[0],"page":17},{"id":"2-129","chapter":2,"number":129,"level":"DE","text":"Quan điểm của chủ nghĩa duy vật biện chứng:","options":["Mối liên hệ nhân quả có tính khách quan, phổ biến và kế thừa","Mối liên hệ nhân quả có tính đa dạng, phong phú, phổ biến và tất yếu","Mối liên hệ nhân quả có tính khách quan, phổ biến và tất yếu","Mối liên hệ nhân quả có tính khách quan, kế thừa và tất yếu"],"correct":[2],"page":17},{"id":"2-130","chapter":2,"number":130,"level":"DE","text":"Tất nhiên là phạm trù triết học dùng để chỉ …….…, do nguyên nhân cơ bản bên trong sự vật, hiện tượng quy định và trong ……….. phải xảy ra đúng như thế chứ không thể khác.","options":["Mối liên hệ bản chất - điều kiện nhất định","Mối liên hệ khách quan - mọi điều kiện","Mối liên hệ chủ yếu - điều kiện nhất định","Mối liên hệ bên trong - mọi điều kiện"],"correct":[0],"page":18},{"id":"2-131","chapter":2,"number":131,"level":"DE","text":"Ngẫu nhiên là phạm trù triết học dùng để chỉ mối liên hệ …….… nên có thể xuất hiện, có thể không xuất hiện; có thể xuất hiện thế này hoặc có thể xuất hiện thế khác”.","options":["Không bản chất, do nguyên nhân, hoàn cảnh bên trong quy định","Không bản chất, do nguyên nhân, hoàn cảnh bên ngoài quy định","Bản chất, do nguyên nhân, hoàn cảnh bên ngoài quy định","Bản chất, do nguyên nhân, hoàn cảnh bên trong quy định"],"correct":[1],"page":18},{"id":"2-132","chapter":2,"number":132,"level":"DE","text":"Nội dung là phạm trù triết học dùng để chỉ tổng thể tất cả ………… tạo nên sự vật, hiện tượng.","options":["Các mặt, yếu tố","Các mối quan hệ","Các đặc điểm, thuộc tính","Các tính chất"],"correct":[0],"page":18},{"id":"2-133","chapter":2,"number":133,"level":"DE","text":"Hình thức là phạm trù triết học dùng để chỉ ………. của sự vật, hiện tượng ấy; là hệ thống các mối liên hệ tương đối bền vững giữa các yếu tố cấu thành nội dung của sự vật, hiện tượng và không chỉ là cái biểu hiện ra bên ngoài, mà còn là cái thể hiện cấu trúc bên trong của sự vật hiện tượng.","options":["Đặc điểm, thuộc tính","Phương thức tồn tại, biểu hiện và phát triển","Màu sắc, hình dạng","Các mặt, yếu tố"],"correct":[1],"page":18},{"id":"2-134","chapter":2,"number":134,"level":"DE","text":"Bản chất là phạm trù triết học dùng để chỉ tổng thể các mối liên hệ ………, quy định sự vận động, phát triển của đối tượng và thể hiện mình thông qua các hiện tượng tương ứng của đối tượng.","options":["Chủ quan, tất nhiên, tương đối ổn định bên trong","Khách quan, tất nhiên, tương đối ổn định bên trong","Khách quan, tất nhiên, tương đối ổn định bên ngoài","Khách quan, ngẫu nhiên, tương đối ổn định bên trong"],"correct":[1],"page":18},{"id":"2-135","chapter":2,"number":135,"level":"DE","text":"Hiện tượng là phạm trù triết học dùng để chỉ những biểu hiện của các mặt, …………; là mặt dễ biến đổi hơn và là hình thức thể hiện của bản chất đối tượng.","options":["Mối liên hệ tất nhiên tương đối ổn định ở bên ngoài","Mối liên hệ tất nhiên tương đối ổn định ở bên trong","Mối liên hệ ngẫu nhiên tương đối ổn định ở bên trong","Mối liên hệ ngẫu nhiên tương đối ổn định ở bên ngoài"],"correct":[0],"page":18},{"id":"2-136","chapter":2,"number":136,"level":"DE","text":"Quy luật là mối liên hệ ………, bền vững, tất yếu giữa các đối tượng và nhất định tác động khi có điều kiện phù hợp.","options":["Phổ biến, chủ quan, bản chất","Phổ biến, khách quan, bản chất","Phổ biến, khách quan, bên ngoài","Trực tiếp, khách quan, bản chất"],"correct":[1],"page":18},{"id":"2-137","chapter":2,"number":137,"level":"DE","text":"Căn cứ vào mức độ phổ biến có thể chia tất cả các quy luật thành các nhóm:","options":["Quy luật riêng, quy luật chung, quy luật phổ biến","Quy luật tự nhiên, quy luật xã hội, quy luật tư duy","Quy luật phổ biến, quy luật tự nhiên, quy luật xã hội, quy luật tư duy","Quy luật đặc thù, quy luật riêng, quy luật chung"],"correct":[0],"page":19},{"id":"2-138","chapter":2,"number":138,"level":"DE","text":"Căn cứ vào lĩnh vực tác động có thể chia các quy luật thành các nhóm:","options":["Quy luật riêng, quy luật chung, quy luật phổ biến","Quy luật tự nhiên, quy luật xã hội, quy luật tư duy","Quy luật phổ biến, quy luật tự nhiên, quy luật xã hội, quy luật tư duy","Quy luật phổ biến, quy luật chung, quy luật riêng"],"correct":[1],"page":19},{"id":"2-139","chapter":2,"number":139,"level":"DE","text":"Quy luật chuyển hóa từ những sự thay đổi về lượng dẫn đến sự thay đổi về chất và ngược lại, chỉ ra:","options":["Cách thức chung nhất của sự vận động và phát triển của sự vật, hiện tượng","Nguyên nhân, động lực của sự vận động, phát triển của sự vật, hiện tượng","Khuynh hướng vận động, phát triển của sự vật hiện tượng","Nguồn gốc sự vận động và phát triển của sự vật"],"correct":[0],"page":19},{"id":"2-140","chapter":2,"number":140,"level":"DE","text":"Chất là khái niệm dùng để chỉ tính quy định khách quan vốn có của sự vật, hiện tượng; ………… làm cho sự vật, hiện tượng là nó chứ không phải là sự vật, hiện tượng khác.","options":["Là sự thống nhất của các thuộc tính, yếu tố tạo nên sự vật, hiện tượng","Là sự thống nhất hữu cơ của các mối liên hệ, yếu tố tạo nên sự vật, hiện tượng","Là sự thống nhất hữu cơ của các thuộc tính, yếu tố tạo nên sự vật, hiện tượng","Là sự thống nhất của các thuộc tính, các mặt tạo nên sự vật, hiện tượng"],"correct":[2],"page":19},{"id":"2-141","chapter":2,"number":141,"level":"DE","text":"Lượng là khái niệm dùng để chỉ tính quy định vốn có của sự vật, hiện tượng về mặt ..…, các yếu tố biểu hiện ở số lượng các thuộc tính, ở tổng số các bộ phận, ở đại lượng, ở tốc độ và nhịp điệu vận động và phát triển, …… của sự vật, hiện tượng.","options":["Phạm vi - cách thức phát triển","Quy mô - cách thức phát triển","Quy mô - trình độ phát triển","Phạm vi - trình độ phát triển"],"correct":[2],"page":19},{"id":"2-142","chapter":2,"number":142,"level":"DE","text":"Độ là khái niệm dùng để chỉ mối liên hệ thống nhất và quy định lẫn nhau giữa chất và lượng; là giới hạn tồn tại của sự vật, hiện tượng mà trong đó …………; sự vật, hiện tượng vẫn là nó, chưa chuyển hóa thành sự vật, hiện tượng khác.","options":["Sự thay đổi về chất chưa dẫn tới thay đổi về lượng","Sự thay đổi về lượng chưa dẫn tới thay đổi căn bản về chất","Sự thay đổi về lượng đã dẫn tới thay đổi về chất","Sự thay đổi về chất đã dẫn tới thay đổi về lượng"],"correct":[1],"page":19},{"id":"2-143","chapter":2,"number":143,"level":"DE","text":"Theo quan điểm của chủ nghĩa duy vật biện chứng:","options":["Chất là mặt tương đối ổn định, lượng là mặt dễ biến đổi hơn","Lượng là mặt tương đối ổn định, chất là mặt dễ biến đổi hơn","Chất và lượng là là những mặt tương đối ổn định","Chất và lượng là những mặt thường xuyên biến đổi"],"correct":[0],"page":19},{"id":"2-144","chapter":2,"number":144,"level":"DE","text":"Mọi sự vật, hiện tượng đều là sự thống nhất của hai mặt đối lập chất và lượng, những sự thay đổi …… về lượng vượt quá giới hạn của độ sẽ dẫn đến sự thay đổi……….. về chất thông qua bước nhảy, chất mới ra đời tiếp tục tác động trở lại duy trì sự thay đổi của lượng.","options":["Căn bản - dần dần","Dần dần - căn bản","Liên tục - đột biến","Đột biến - liên tục"],"correct":[1],"page":20},{"id":"2-145","chapter":2,"number":145,"level":"DE","text":"Quy luật thống nhất và đấu tranh của các mặt đối lập làm rõ:","options":["Cách thức chung nhất của sự vận động và phát triển của sự vật, hiện tượng","Nguyên nhân hay nguồn gốc, động lực của sự vận động, phát triển của sự vật, hiện tượng","Khuynh hướng vận động, phát triển của sự vật hiện tượng","Con đường vận động, phát triển của sự vật"],"correct":[1],"page":20},{"id":"2-146","chapter":2,"number":146,"level":"DE","text":"Quy luật được coi là hạt nhân của phép biện chứng duy vật là:","options":["Quy luật chuyển hóa từ những thay đổi về lượng dẫn đến những thay đổi về chất và ngược lại","Quy luật thống nhất và đấu tranh của các mặt đối lập","Quy luật phủ định của phủ định","Quy luật tự nhiên và xã hội"],"correct":[1],"page":20},{"id":"2-147","chapter":2,"number":147,"level":"DE","text":"Mâu thuẫn biện chứng là khái niệm dùng để chỉ sự liên hệ, tác động theo cách ……………; vừa đòi hỏi, vừa loại trừ, vừa chuyển hóa lẫn nhau giữa các mặt đối lập.","options":["Vừa thống nhất, vừa đấu tranh","Vừa đồng nhất, vừa khác biệt","Vừa tuần tự, vừa nhảy vọt","Vừa trực tiếp, vừa gián tiếp"],"correct":[0],"page":20},{"id":"2-148","chapter":2,"number":148,"level":"DE","text":"Đấu tranh giữa các mặt đối lập là khái niệm dùng để chỉ sự tác động qua lại theo hướng …………… lẫn nhau giữa các mặt đối lập.","options":["Bài trừ, phủ định","Liên kết","Hợp tác","Cạnh tranh"],"correct":[0],"page":20},{"id":"2-149","chapter":2,"number":149,"level":"DE","text":"Theo quan điểm của chủ nghĩa duy vật biện chứng, sự đấu tranh giữa các mặt đối lập có tính:","options":["Tương đối","Tuyệt đối","Tương đồng","Cân bằng"],"correct":[1],"page":20},{"id":"2-150","chapter":2,"number":150,"level":"DE","text":"Mâu thuẫn nổi lên hàng đầu ở mỗi giai đoạn phát triển của sự vật, hiện tượng và có tác dụng quy định đối với các mâu thuẫn khác trong cùng giai đoạn đó là:","options":["Mâu thuẫn không cơ bản","Mâu thuẫn chủ yếu","Mâu thuẫn đối kháng","Mâu thuẫn bên trong"],"correct":[1],"page":20},{"id":"2-151","chapter":2,"number":151,"level":"DE","text":"Mâu thuẫn có vai trò quyết định trực tiếp quá trình vận động và phát triển của sự vật, hiện tượng là:","options":["Mâu thuẫn thứ yếu","Mâu thuẫn cơ bản","Mâu thuẫn bên trong","Mâu thuẫn đối kháng"],"correct":[2],"page":20},{"id":"2-152","chapter":2,"number":152,"level":"DE","text":"Căn cứ vào tính chất mối quan hệ lợi ích giữa các giai cấp, các lực lượng xã hội ở mỗi giai đoạn lịch sử nhất định, có thể phân chia mâu thuẫn thành:","options":["Mâu thuẫn chủ yếu và mâu thuẫn thứ yếu","Mâu thuẫn cơ bản và mâu thuẫn không cơ bản","Mâu thuẫn bên trong và mâu thuẫn bên ngoài","Mâu thuẫn đối kháng và mâu thuẫn không đối kháng"],"correct":[3],"page":21},{"id":"2-153","chapter":2,"number":153,"level":"DE","text":"Phủ định biện chứng có tính chất:","options":["Khách quan; kế thừa; phổ biến; đa dạng, phong phú","Khách quan, toàn diện, phát triển, lịch sử - cụ thể","Khách quan; kế thừa; đặc thù; vượt trước","Khách quan; toàn diện; kế thừa; ngẫu nhiên"],"correct":[0],"page":21},{"id":"2-154","chapter":2,"number":154,"level":"DE","text":"Tính phổ biến của phủ định biện chứng thể hiện là:","options":["Phủ định biện chứng diễn ra trong lĩnh vực tự nhiên","Phủ định biện chứng diễn ra trong mọi lĩnh vực tự nhiên, xã hội và tư duy","Phủ định biện chứng diễn ra trong lĩnh vực xã hội","Phủ định biện chứng diễn ra trong lĩnh vực tư duy"],"correct":[1],"page":21},{"id":"2-155","chapter":2,"number":155,"level":"DE","text":"Lý luận nhận thức là một bộ phận của triết học nghiên cứu …….. của nhận thức, các giai đoạn của nhận thức, con đường để đạt tới chân lý, tiêu chuẩn của chân lý.","options":["Quy luật","Bản chất","Mối quan hệ","Hình thức"],"correct":[1],"page":21},{"id":"2-156","chapter":2,"number":156,"level":"DE","text":"Lý luận nhận thức trả lời câu hỏi:","options":["Bản chất của thế giới của thế giới là gì?","Vật chất có trước, quyết định ý thức hay ý thức có trước, quyết định vật chất?","Con người có nhận thức được thế giới hay không?","Triết học là gì?"],"correct":[2],"page":21},{"id":"2-157","chapter":2,"number":157,"level":"DE","text":"Nhận thức chính là quá trình tự ý thức (tự nhận thức) của tinh thần thế giới, là quan điểm của:","options":["Chủ nghĩa hoài nghi","Chủ nghĩa duy tâm chủ quan","Chủ nghĩa duy vật biện chứng","Chủ nghĩa duy tâm khách quan (Hêghen)"],"correct":[3],"page":21},{"id":"2-158","chapter":2,"number":158,"level":"DE","text":"Con người không thể nhận thức được bản chất của thế giới, chỉ có thể nhận thức được các hiện tượng bên ngoài của sự vật, là quan điểm của:","options":["Thuyết hoài nghi","Chủ nghĩa duy tâm khách quan","Thuyết không thể biết","Chủ nghĩa duy vật biện chứng"],"correct":[2],"page":21},{"id":"2-159","chapter":2,"number":159,"level":"DE","text":"V.I.Lênin đã chỉ rõ:","options":["Chỉ có những cái mà con người chưa biết chứ không có cái gì không thể biết","Có những cái con người có thể biết và có những cái con người không thể biết","Con người đã biết mọi thứ về thế giới","Con người chưa biết gì về thế giới"],"correct":[0],"page":21},{"id":"2-160","chapter":2,"number":160,"level":"DE","text":"Thực tiễn là toàn bộ những hoạt động vật chất - cảm tính, có tính ……. của con người nhằm cải tạo tự nhiên và xã hội phục vụ nhân loại tiến bộ.","options":["Phổ biến","Giai cấp","Lịch sử - xã hội","Toàn diện"],"correct":[2],"page":22},{"id":"2-161","chapter":2,"number":161,"level":"DE","text":"Những hình thức cơ bản của hoạt động thực tiễn là:","options":["Hoạt động sản xuất vật chất; hoạt động kinh tế - xã hội và hoạt động thực nghiệm khoa học","Hoạt động chính trị - xã hội và hoạt động thực nghiệm khoa học","Hoạt động sản xuất vật chất và hoạt động chính trị - xã hội","Hoạt động sản xuất vật chất; hoạt động chính trị - xã hội và hoạt động thực nghiệm khoa học"],"correct":[3],"page":22},{"id":"2-162","chapter":2,"number":162,"level":"DE","text":"Tiêu chuẩn khách quan duy nhất để kiểm tra chân lý là:","options":["Tri thức","Thực tiễn","Sự tán thành của số đông","Lợi ích"],"correct":[1],"page":22},{"id":"2-163","chapter":2,"number":163,"level":"DE","text":"V. I. Lênin đã khái quát con đường biện chứng của quá trình nhận thức: “Từ trực quan sinh động đến tư duy trừu tượng, và từ tư duy trừu tượng đến ………… - đó là con đường biện chứng của sự nhận thức chân lý, của sự nhận thức thực tại khách quan”.","options":["Thực tiễn","Trực quan sinh động","Tư duy cụ thể","Tư duy khái quát"],"correct":[0],"page":22},{"id":"2-164","chapter":2,"number":164,"level":"DE","text":"Theo quan điểm của chủ nghĩa duy vật biện chứng, quá trình nhận thức bao gồm:","options":["Một giai đoạn nhận thức","Hai giai đoạn nhận thức","Ba giai đoạn nhận thức","Bốn giai đoạn nhận thức"],"correct":[1],"page":22},{"id":"2-165","chapter":2,"number":165,"level":"DE","text":"Giai đoạn nhận thức cảm tính bao gồm các hình thức:","options":["Cảm giác, tri giác, suy lý (suy luận)","Cảm giác, tri giác, biểu tượng","Cảm giác, tri giác, khái niệm","Cảm giác, biểu tượng, phán đoán"],"correct":[0],"page":22},{"id":"2-166","chapter":2,"number":166,"level":"DE","text":"Hình thức đầu tiên, đơn giản nhất của giai đoạn nhận thức cảm tính là:","options":["Cảm giác","Khái niệm","Tri giác","Biểu tượng"],"correct":[0],"page":22},{"id":"2-167","chapter":2,"number":167,"level":"DE","text":"Hình thức cao nhất của giai đoạn nhận thức cảm tính là:","options":["Suy lý (suy luận)","Biểu tượng","Cảm giác","Khái niệm"],"correct":[1],"page":22},{"id":"2-168","chapter":2,"number":168,"level":"DE","text":"Trực quan sinh động là giai đoạn:","options":["Nhận thức cảm tính","Nhận thức lý tính","Tư duy trừu tượng","Giai đoạn cao của nhận thức"],"correct":[0],"page":23},{"id":"2-169","chapter":2,"number":169,"level":"DE","text":"Tư duy trừu tượng là giai đoạn:","options":["Nhận thức cảm tính","Nhận thức lý tính","Trực quan sinh động","Giai đoạn đầu tiên của quá trình nhận thức"],"correct":[1],"page":23},{"id":"2-170","chapter":2,"number":170,"level":"DE","text":"Giai đoạn nhận thức lý tính bao gồm các hình thức:","options":["Cảm giác, tri giác, biểu tượng","Biểu tượng, khái niệm, phán đoán","Khái niệm, phán đoán, suy lý (suy luận)","Tri giác, biểu tượng, phán đoán"],"correct":[2],"page":23},{"id":"2-171","chapter":2,"number":171,"level":"TB","text":"Chân lý có tính chất:","options":["Tính khách quan, toàn diện và lịch sử - cụ thể","Tính khách quan, tính tương đối và tính tuyệt đối, tính cụ thể","Tính khách quan, tính phát triển và tính thực tiễn","Tính khách quan, tính tương đối và tính tuyệt đối, tính trừu tượng"],"correct":[1],"page":23},{"id":"2-172","chapter":2,"number":172,"level":"TB","text":"Quan niệm của các nhà triết học duy vật thời kỳ cận đại về vật chất:","options":["Đồng nhất vật chất với khối lượng; xem vật chất, vận động, không gian thời gian như những thực thể khác nhau, không có mối liên hệ nội tại với nhau","Phủ nhận sự tồn tại khách quan của vật chất","Đồng nhất vật chất với nguyên tử","Đồng nhất vật chất với một nhóm vật thể"],"correct":[0],"page":23},{"id":"2-173","chapter":2,"number":173,"level":"TB","text":"Quan điểm của chủ nghĩa duy vật biện chứng:","options":["Vật chất là thực tại chủ quan - cái tồn tại hiện thực bên ngoài ý thức và không lệ thuộc vào ý thức","Vật chất là thực tại khách quan - cái tồn tại hiện thực bên ngoài ý thức và luôn luôn lệ thuộc vào ý thức","Vật chất là thực tại khách quan - cái tồn tại hiện thực bên ngoài ý thức và không lệ thuộc vào ý thức","Vật chất là thực tại chủ quan - cái tồn tại hiện thực bên ngoài ý thức và luôn luôn lệ thuộc vào ý thức"],"correct":[2],"page":23},{"id":"2-174","chapter":2,"number":174,"level":"TB","text":"Theo quan điểm của chủ nghĩa duy vật biện chứng, đặc tính của vật chất là:","options":["Tồn tại với tư cách là thực tại chủ quan","Tồn tại lệ thuộc vào cảm giác","Tồn tại với tư cách là thực tại khách quan","Tồn tại trừu tượng"],"correct":[2],"page":23},{"id":"2-175","chapter":2,"number":175,"level":"TB","text":"Quan điểm nào dưới đây không phải của của chủ nghĩa duy vật biện chứng:","options":["Về nguyên tắc, con người không thể nhận thức được thế giới vật chất","Về nguyên tắc, con người có thể nhận thức được thế giới vật chất","Về nguyên tắc, trong thế giới vật chất không có gì là không thể biết","Về nguyên tắc, trong thế giới vật chất chỉ có những cái đã biết và những cái chưa biết"],"correct":[0],"page":23},{"id":"2-176","chapter":2,"number":176,"level":"TB","text":"Quan điểm của chủ nghĩa duy vật biện chứng:","options":["Vận động là kết quả do “cái hích của Thượng đế” tạo ra","Vận động là một phương thức tồn tại của vật chất, là một thuộc tính cố hữu của vật chất, bao gồm mọi sự biến đổi nói chung từ giản đơn cho đến tư duy","Vận động chỉ là sự thay đổi vị trí của các sự vật, hiện tượng trong không gian và thời gian","Vận động là do sự tác động của những lực cân bằng nhau"],"correct":[1],"page":24},{"id":"2-177","chapter":2,"number":177,"level":"TB","text":"Chủ nghĩa duy vật biện chứng cho rằng:","options":["Không gian và thời gian của một sự vật, hiện tượng cụ thể là có tận cùng và hữu hạn","Không gian và thời gian của một sự vật, hiện tượng cụ thể là vô cùng, vô tận, không có giới hạn","Không gian của một sự vật, hiện tượng cụ thể là vô cùng, vô tận; thời gian của một sự vật, hiện tượng cụ thể là hữu hạn","Không gian của một sự vật, hiện tượng cụ thể là hữu hạn; thời gian của một sự vật, hiện tượng cụ thể là vô cùng, vô tận"],"correct":[0],"page":24},{"id":"2-178","chapter":2,"number":178,"level":"TB","text":"Quan điểm của chủ nghĩa duy vật biện chứng, bản chất của thế giới là:","options":["Vật chất","Tinh thần","Tồn tại","Ý thức"],"correct":[0],"page":24},{"id":"2-179","chapter":2,"number":179,"level":"TB","text":"Quan điểm nào dưới đây không phải của chủ nghĩa duy vật biện chứng?","options":["Chỉ có một thế giới duy nhất và thống nhất là thế giới vật chất","Có hai thế giới là thế giới vật chất và thế giới tinh thần","Thế giới vật chất tồn tại khách quan, có trước và độc lập với ý thức của con người, được ý thức con người phản ánh","Mọi bộ phận của thế giới có mối quan hệ vật chất thống nhất với nhau"],"correct":[1],"page":24},{"id":"2-180","chapter":2,"number":180,"level":"TB","text":"Quan điểm nào dưới đây không phải của chủ nghĩa duy vật biện chứng?","options":["Thế giới vật chất không do ai sinh ra và cũng không tự mất đi, tồn tại vĩnh viễn, vô hạn và vô tận","Trong thế giới, các sự vật, hiện tượng luôn luôn vận động, biến đổi không ngừng và chuyển hóa lẫn nhau","Trong thế giới, các sự vật, hiện tượng là nguồn gốc, nguyên nhân và kết quả của nhau, về thực chất, đều là những quá trình vật chất","Trong thế giới, các sự vật, hiện tượng tồn tại biệt lập, tách rời, không có mối liên hệ nhân - quả với nhau, về thực chất, đều là những quá trình vật chất"],"correct":[3],"page":24},{"id":"2-181","chapter":2,"number":181,"level":"TB","text":"Quan điểm nào dưới đây không phải của chủ nghĩa duy vật biện chứng:","options":["Con người không thể bằng ý thức của mình sản sinh ra được các đối tượng vật chất","Con người bằng ý thức của mình sản sinh ra được các đối tượng vật chất","Con người chỉ có thể cải biến được thế giới vật chất trên cơ sở nắm vững những thuộc tính khách quan vốn có của các dạng vật chất và những quy luật vận động của thế giới vật chất","Vật chất không tự nhiên sinh ra và không mất đi, mà luôn chuyển hóa từ dạng này sang dạng khác"],"correct":[1],"page":24},{"id":"2-182","chapter":2,"number":182,"level":"TB","text":"Các nhà triết học duy tâm cho rằng:","options":["Ý thức là một dạng vật chất đặc biệt, do vật chất sản sinh ra","Ý thức là thuộc tính phổ biến của mọi dạng vật chất","Ý thức là nguyên thể đầu tiên, tồn tại vĩnh viễn, là nguyên nhân sinh thành, chi phối sự tồn tại, biến đổi của toàn bộ thế giới vật chất","Ý thức là thuộc tính của một dạng vật chất sống có tổ chức cao nhất là bộ óc con người"],"correct":[2],"page":24},{"id":"2-183","chapter":2,"number":183,"level":"TB","text":"Chủ nghĩa duy vật biện chứng cho rằng:","options":["Ý thức là một dạng vật chất đặc biệt, do vật chất sản sinh ra","Ý thức là thuộc tính phổ biến của mọi dạng vật chất","Ý thức là nguyên thể đầu tiên, tồn tại vĩnh viễn, là nguyên nhân sinh thành, chi phối sự tồn tại, biến đổi của toàn bộ thế giới vật chất","Ý thức là thuộc tính của một dạng vật chất sống có tổ chức cao nhất là bộ óc con người"],"correct":[3],"page":25},{"id":"2-184","chapter":2,"number":184,"level":"TB","text":"Quan điểm nào dưới đây không phải của chủ nghĩa duy vật biện chứng?","options":["Bộ óc người là khí quan vật chất của ý thức","Ý thức là chức năng của bộ óc người hoạt động bình thường","Ý thức là trình độ phản ánh cao nhất của thế giới vật chất","Ý thức chỉ là một dạng vật chất đặc biệt"],"correct":[3],"page":25},{"id":"2-185","chapter":2,"number":185,"level":"TB","text":"Quan điểm nào dưới đây không phải của chủ nghĩa duy vật biện chứng?","options":["Ý thức là hình thức phản ánh đặc trưng chỉ có ở con người và động vật bậc cao.","Ý thức là hình thức phản ánh đặc trưng chỉ có ở con người","Ý thức là hình thức phản ánh cao nhất của thế giới vật chất","Ý thức là sự phản ánh sáng tạo thế giới hiện thực bởi bộ óc con người"],"correct":[0],"page":25},{"id":"2-186","chapter":2,"number":186,"level":"TB","text":"Sự kích thích chủ yếu làm chuyển biến dần bộ óc của loài vượn người thành bộ óc con người và tâm lý động vật thành ý thức con người, là:","options":["Lao động","Ngôn ngữ","Lao động và ngôn ngữ","Thế giới khách quan"],"correct":[2],"page":25},{"id":"2-187","chapter":2,"number":187,"level":"TB","text":"Theo quan điểm của chủ nghĩa duy vật biện chứng, muốn hiểu đúng bản chất của ý thức cần:","options":["Xem xét nó trong mối quan hệ qua lại với vật chất, mà chủ yếu là đời sống hiện thực có tính thực tiễn của con người","Coi ý thức cũng chỉ là một dạng vật chất","Coi ý thức chỉ là sự phản ánh giản đơn, thụ động thế giới vật chất, tách rời thực tiễn xã hội rất phong phú, sinh động","Coi ý thức là một thực thể tồn tại độc lập, thực tại duy nhất và là nguồn gốc sinh ra thế giới vật chất"],"correct":[0],"page":25},{"id":"2-188","chapter":2,"number":188,"level":"TB","text":"Theo quan điểm của chủ nghĩa duy vật biện chứng:","options":["Thế giới khách quan là nguyên bản, là tính thứ nhất. Còn ý thức chỉ là bản sao, là “hình ảnh” về thế giới đó, là tính thứ hai","Ý niệm tuyệt đối là nguyên bản, là tính thứ nhất. Còn thế giới khách quan chỉ là bản sao, là “hình ảnh” về vật chất, là tính thứ hai","Ý thức là nguyên bản, là tính thứ nhất. Còn Thế giới khách quan chỉ là bản sao, là “hình ảnh” của ý thức, là tính thứ hai","Thế giới chủ quan là nguyên bản, là tính thứ nhất. Còn ý thức chỉ là bản sao, là “hình ảnh” về thế giới đó, là tính thứ hai"],"correct":[0],"page":25},{"id":"2-189","chapter":2,"number":189,"level":"TB","text":"Chủ nghĩa duy vật biện chứng cho rằng:","options":["Ý thức là tồn tại duy nhất, tuyệt đối, là tính thứ nhất từ đó sinh ra tất cả; còn thế giới vật chất chỉ là bản sao, biểu hiện khác của ý thức tinh thần, là tính thức hai, do ý thức tinh thần sinh ra","Vật chất và ý thức có mối quan hệ biện chứng, trong đó vật chất quyết định ý thức, còn ý thức tác động tích cực trở lại vật chất","Vật chất sinh ra ý thức, quyết định ý thức, ý thức lệ thuộc hoàn toàn vào vật chất","Vật chất và ý thức tồn tại tách rời, không có mối liên hệ tác động qua lại lẫn nhau"],"correct":[1],"page":25},{"id":"2-190","chapter":2,"number":190,"level":"TB","text":"Vai trò của vật chất đối với ý thức được thể hiện:","options":["Vật chất quyết định nguồn gốc; nội dung, bản chất và sự vận động, phát triển của ý thức","Vật chất quyết định nội dung, bản chất và sự phát triển của ý thức","Vật chất quyết định nội dung, bản chất và sự vận động, phát triển của ý thức","Vật chất quyết định hình thành của ý thức"],"correct":[0],"page":26},{"id":"2-191","chapter":2,"number":191,"level":"TB","text":"Chủ nghĩa duy vật biện chứng cho rằng:","options":["Ý thức do vật chất sinh ra, ý thức lệ thuộc hoàn toàn vào vật chất","Ý thức là một hiện tượng tinh thần, hoàn toàn không có mối quan hệ gì với vật chất","Ý thức một khi ra đời thì có tính độc lập tương đối, tác động trở lại thế giới vật chất","Ý thức có trước, ý thức sinh ra và quyết định vật chất"],"correct":[2],"page":26},{"id":"2-192","chapter":2,"number":192,"level":"TB","text":"Theo quan niệm của phép biện chứng duy vật:","options":["Các sự vật, hiện tượng của thế giới tồn tại trong mối liên hệ qua lại với nhau, quy định lẫn nhau, thâm nhập, chuyển hóa lẫn nhau, không tách biệt nhau","Các sự vật, hiện tượng của thế giới tồn tại tách rời nhau, cái này bên cạnh cái kia","Các sự vật, hiện tượng tồn tại cô lập, tách rời, không có sự liên hệ chuyển hóa lẫn nhau; hoặc nếu có thì đó chỉ là mối liên hệ có tính ngẫu nhiên, bên ngoài","Các sự vật, hiện tượng của thế giới không có mối liên hệ tất yếu với nhau"],"correct":[0],"page":26},{"id":"2-193","chapter":2,"number":193,"level":"TB","text":"Theo quan niệm của phép biện chứng duy vật, mối liên hệ phổ biến là:","options":["Mối liên hệ tồn tại trong giới tự nhiên","Mối liên hệ tồn tại trong tư duy","Mối liên hệ tồn tại trong xã hội loài người","Mối liên hệ tồn tại trong cả tự nhiên, xã hội loài người và tư duy"],"correct":[3],"page":26},{"id":"2-194","chapter":2,"number":194,"level":"TB","text":"Phép biện chứng duy vật cho rằng:","options":["Sự vật, hiện tượng có nhiều mối liên hệ; việc phân loại các mối liên hệ chỉ mang tính tương đối","Sự vật, hiện tượng có nhiều mối liên hệ; việc phân loại các mối liên hệ mang tính tuyệt đối","Sự vật, hiện tượng có nhiều mối liên hệ; việc phân loại các mối liên hệ phụ thuộc vào ý muốn chủ quan của con người","Sự vật, hiện tượng có nhiều mối liên hệ; việc phân loại các mối liên hệ mang tính đa dạng"],"correct":[0],"page":26},{"id":"2-195","chapter":2,"number":195,"level":"TB","text":"Theo quan điểm của phép biện chứng duy vật, phát triển là:","options":["Mọi vận động của vật chất","Vận động theo khuynh hướng đi lên","Vận động trong thăng bằng, trong sự ổn định tương đối","Vận động theo khuynh hướng đi xuống"],"correct":[1],"page":26},{"id":"2-196","chapter":2,"number":196,"level":"TB","text":"Chủ nghĩa Mác - Lênin cho rằng:","options":["Nguồn gốc của sự phát triển nằm trong chính bản thân sự vật, hiện tượng","Nguồn gốc của sự phát triển là do sự tác động từ bên ngoài sự vật, hiện tượng","Nguồn gốc của sự phát triển là do ý muốn chủ quan của con người","Nguồn gốc của sự phát triển là do nguyên nhân khách quan"],"correct":[0],"page":26},{"id":"2-197","chapter":2,"number":197,"level":"TB","text":"Chủ nghĩa duy vật biện chứng cho rằng:","options":["Cái đơn nhất và cái chung là những mặt của cái riêng, tồn tại trong cái riêng, gắn bó hữu cơ với nhau, trong những điều kiện xác định chuyển hóa cho nhau","Cái đơn nhất và cái chung là những mặt của cái riêng, tồn tại trong cái riêng, chúng hoàn toàn độc lập với nhau và không có khả năng chuyển hóa cho nhau","Cái chung là cái toàn bộ, có tính hệ thống; cái đơn nhất chỉ là cái bộ phận nằm trong cái chung và là một phần của cái chung","Chỉ có cái chung trong điều kiện xác định có thể chuyển hóa thành cái đơn nhất; cái đơn nhất không thể chuyển hóa thành cái chung"],"correct":[0],"page":27},{"id":"2-198","chapter":2,"number":198,"level":"TB","text":"Chủ nghĩa duy vật biện chứng cho rằng:","options":["Cái riêng là cái toàn bộ, cái chung chỉ là bộ phận","Cái riêng là cái bộ phận, cái chung là cái toàn bộ","Cả cái chung và cái riêng đều là bộ phận","Cả cái chung và cái riêng đều là cái toàn bộ"],"correct":[0],"page":27},{"id":"2-199","chapter":2,"number":199,"level":"TB","text":"Chủ nghĩa duy vật biện chứng cho rằng:","options":["Cái chung và cái đơn nhất là cái toàn bộ","Cái chung và cái đơn nhất là bộ phận","Cái chung là cái toàn bộ và cái đơn nhất là bộ phận","Cái chung là bộ phận và cái đơn nhất là cái toàn bộ"],"correct":[1],"page":27},{"id":"2-200","chapter":2,"number":200,"level":"TB","text":"Theo quan điểm của chủ nghĩa duy vật biện chứng:","options":["Một nguyên nhân chỉ sinh ra một kết quả","Một kết quả chỉ do một nguyên nhân sinh ra","Một kết quả do nhiều nguyên nhân sinh ra, các nguyên nhân có vai trò như nhau trong việc sinh ra kết quả","Một kết quả do nhiều nguyên nhân sinh ra, các nguyên nhân có vai trò khác nhau trong việc sinh ra kết quả"],"correct":[3],"page":27},{"id":"2-201","chapter":2,"number":201,"level":"TB","text":"Theo quan điểm của chủ nghĩa duy vật biện chứng, nguyên nhân giữ vai trò quyết định đến việc sinh ra kết quả là:","options":["Nguyên nhân chủ yếu, nguyên nhân bên trong","Nguyên nhân chủ yếu, nguyên nhân bên ngoài","Nguyên nhân thứ yếu, nguyên nhân bên ngoài","Nguyên nhân thứ yếu, nguyên nhân bên trong"],"correct":[0],"page":27},{"id":"2-202","chapter":2,"number":202,"level":"TB","text":"Theo quan điểm của chủ nghĩa duy vật biện chứng:","options":["Mọi sự vật, hiện tượng đều có tất nhiên và ngẫu nhiên, ranh giới giữa tất nhiên và ngẫu nhiên chỉ có tính tương đối","Mọi sự vật, hiện tượng đều có tất nhiên và ngẫu nhiên, ranh giới giữa tất nhiên và ngẫu nhiên có tính tuyệt đối","Tất nhiên và ngẫu nhiên có vai trò như nhau trong quá trình vận động, phát triển của sự vật, hiện tượng","Chỉ tất nhiên mới có vai trò trong sự vận động, phát triển của sự vật, ngẫu nhiên không có vai trò gì trong sự vận động, phát triển ấy"],"correct":[0],"page":27},{"id":"2-203","chapter":2,"number":203,"level":"TB","text":"Theo quan điểm của chủ nghĩa duy vật biện chứng:","options":["Trong sự vận động, phát triển của sự vật, tất nhiên và ngẫu nhiên không thể chuyển hóa cho nhau","Trong những điều kiện nhất định của sự vận động, phát triển của sự vật, tất nhiên và ngẫu nhiên có thể chuyển hóa cho nhau","Chỉ có tất nhiên chuyển hóa thành ngẫu nhiên trong quá trình vận động, phát triển của sự vật, hiện tượng mà không có chiều ngược lại","Chỉ có ngẫu nhiên chuyển hóa thành tất nhiên trong quá trình vận động, phát triển của sự vật, hiện tượng mà không có chiều ngược lại"],"correct":[1],"page":27},{"id":"2-204","chapter":2,"number":204,"level":"TB","text":"Theo quan điểm của chủ nghĩa duy vật biện chứng:","options":["Hình thức là cái biểu hiện ra bên ngoài sự vật, hiện tượng","Hình thức là cái biểu hiện cấu trúc bên trong sự vật, hiện tượng","Hình thức không chỉ là cái biểu hiện ra bên ngoài, mà còn là cái biểu hiện cấu trúc bên trong của sự vật, hiện tượng","Hình thức của sự vật, hiện tượng là yếu tố bất biến, không có sự thay đổi, phát triển"],"correct":[2],"page":28},{"id":"2-205","chapter":2,"number":205,"level":"TB","text":"Theo quan điểm của chủ nghĩa duy vật biện chứng:","options":["Nội dung và hình thức của sự vật, hiện tượng tồn tại thống nhất chặt chẽ trong mối liên hệ phụ thuộc lẫn nhau, trong đó nội dung giữ vai trò quyết định hình thức","Nội dung và hình thức của sự vật, hiện tượng tồn tại thống nhất chặt chẽ, trong đó hình thức giữ vai trò quyết định nội dung","Nội dung và hình thức của sự vật, hiện tượng tồn tại độc lập không có sự liên hệ, phụ thuộc lẫn nhau","Nội dung và hình thức của sự vật, hiện tượng tồn tại thống nhất chặt chẽ trong mối liên hệ phụ thuộc lẫn nhau, sự tác động qua lại của chúng là như nhau"],"correct":[0],"page":28},{"id":"2-206","chapter":2,"number":206,"level":"TB","text":"Theo quan điểm của chủ nghĩa duy vật biện chứng:","options":["Bản chất và hiện tượng tồn tại khách quan trong mối liên hệ hữu cơ. Về cơ bản, bản chất và hiện tượng có xu hướng phù hợp với nhau","Bản chất và hiện tượng tồn tại khách quan trong mối liên hệ hữu cơ. Bản chất và hiện tượng hoàn toàn đồng nhất với với nhau","Bản chất tồn tại khách quan, hiện tượng tồn tại mang tính chủ quan, giữa chúng không có mối liên hệ hữu cơ với nhau","Bản chất và hiện tượng tồn tại khách quan. Về cơ bản bản chất và hiện tượng có xu hướng đối lập nhau"],"correct":[0],"page":28},{"id":"2-207","chapter":2,"number":207,"level":"TB","text":"Theo quan điểm của chủ nghĩa duy vật biện chứng:","options":["Bản chất và hiện tượng tồn tại biệt lập, tách rời, giữa chúng không có mối liên hệ qua lại","Bản chất tồn tại thông qua hiện tượng còn hiện tượng phải là sự thể hiện của bản chất","Hiện tượng là ‘sự sao chép lại” bản chất","Hiện tượng luôn luôn xuyên tạc bản chất"],"correct":[1],"page":28},{"id":"2-208","chapter":2,"number":208,"level":"TB","text":"Quan điểm nào dưới dây không phải là của chủ nghĩa duy vật biện chứng?","options":["Bản chất và hiện tượng luôn phù hợp với nhau trong mọi điều kiện","Trong những điều kiện nhất định, hiện tượng biểu hiện bản chất dưới hình thức bị cải biến, xuyên tạc bản chất","Hiện tượng có thể phong phú hay nghèo nàn hơn bản chất","Bản chất luôn là cái tương đối ổn định, ít biến đổi hơn, còn hiện tượng “động” hơn, thường xuyên biến đổi"],"correct":[0],"page":28},{"id":"2-209","chapter":2,"number":209,"level":"TB","text":"Theo quan điểm của chủ nghĩa duy vật biện chứng:","options":["Hiện thực bao hàm trong mình nhiều khả năng, tất cả các khả năng đó đều được hiện thực hóa","Hiện thực bao hàm trong mình nhiều khả năng, nhưng không phải tất cả các khả năng đó đều được hiện thực hóa","Hiện thực bao hàm trong mình chỉ một khả năng, khả năng đó được hiện thực hóa","Hiện thực bao hàm trong mình chỉ một khả năng, khả năng đó tất yếu được hiện thực hóa"],"correct":[1],"page":28},{"id":"2-210","chapter":2,"number":210,"level":"TB","text":"Theo quan điểm của chủ nghĩa duy vật biện chứng:","options":["Mỗi sự vật, hiện tượng chỉ có một chất duy nhất","Mỗi sự vật không chỉ có một chất mà có thể có nhiều chất","Chất trong mỗi sự vật, hiện tượng ổn định tuyệt đối","Chất nằm ngoài sự vật, hiện tượng"],"correct":[1],"page":29},{"id":"2-211","chapter":2,"number":211,"level":"TB","text":"Theo quan điểm của chủ nghĩa duy vật biện chứng:","options":["Điểm nút là điểm bất kỳ trong sự thay đổi về lượng của sự vật, hiện tượng","Điểm nút là điểm mà ở đó chất và lượng của sự vật có sự thống nhất với nhau","Điểm nút là điểm giới hạn mà tại đó sự thay đổi về lượng đạt tới chỗ phá vỡ độ cũ, làm cho chất của sự vật thay đổi, chuyển thành chất mới, thời điểm mà tại đó bắt đầu xảy ra bước nhảy","Điểm nút thể hiện sự thay đổi về chất của sự vật"],"correct":[2],"page":29},{"id":"2-212","chapter":2,"number":212,"level":"TB","text":"Theo quan điểm của chủ nghĩa duy vật biện chứng:","options":["Bước nhảy kết thúc một giai đoạn biến đổi về lượng, là sự gián đoạn trong quá trình vận động liên tục của sự vật, hiện tượng","Bước nhảy là điểm giới hạn mà tại đó sự thay đổi về lượng đạt tới chỗ phá vỡ độ cũ, làm cho chất của sự vật, hiện tượng thay đổi, chuyển thành chất mới","Bước nhảy là giới hạn cuối cùng của sự phát triển về lượng của sự vật, hiện tượng","Bước nhảy kết thúc sự phát triển của sự vật, hiện tượng"],"correct":[0],"page":29},{"id":"2-213","chapter":2,"number":213,"level":"TB","text":"Theo quan điểm của chủ nghĩa duy vật biện chứng:","options":["Chất và lượng của sự vật, hiện tượng có mối quan hệ thống nhất tuyệt đối","Sự thay đổi về lượng dẫn đến sự thay đổi về chất và không có chiều ngược lại","Sự thay đổi về chất dẫn đến sự thay đổi về lượng và không có chiều ngược lại","Lượng và chất của sự vật, hiện tượng có quan hệ biện chứng; những thay đổi về lượng dẫn đến những thay đổi về chất và ngược lại"],"correct":[3],"page":29},{"id":"2-214","chapter":2,"number":214,"level":"TB","text":"Theo quan điểm của chủ nghĩa duy vật biện chứng, bước nhảy toàn bộ là:","options":["Bước nhảy làm cho tất cả các mặt, các bộ phận, các yếu tố,… của sự vật, hiện tượng thay đổi","Bước nhảy làm chất của sự vật, hiện tượng biến đổi mau chóng ở tất cả các bộ phận","Bước nhảy chỉ làm thay đổi một số mặt, một số yếu tố, một số bộ phận, … của sự vật, hiện tượng","Là bước nhảy diễn ra trong khoảng thời gian lâu dài"],"correct":[0],"page":29},{"id":"2-215","chapter":2,"number":215,"level":"TB","text":"Theo quan điểm của chủ nghĩa duy vật biện chứng, bước nhảy cục bộ là:","options":["Bước nhảy làm cho tất cả các mặt, các bộ phận, các yếu tố, … của sự vật, hiện tượng thay đổi","Bước nhảy làm chất của sự vật, hiện tượng biến đổi mau chóng ở tất cả các bộ phận","Bước nhảy chỉ làm thay đổi một số mặt, một số yếu tố, một số bộ phận, … của sự vật, hiện tượng","Là bước nhảy diễn ra trong khoảng thời gian lâu dài"],"correct":[2],"page":29},{"id":"2-216","chapter":2,"number":216,"level":"TB","text":"Theo quan điểm của chủ nghĩa duy vật biện chứng, trong mỗi mâu thuẫn, các mặt đối lập:","options":["Vừa ổn định, vừa phát triển","Vừa thống nhất với nhau, vừa đấu tranh với nhau","Chỉ có sự thống nhất với nhau, không có sự đấu tranh với nhau","Chỉ có sự đấu tranh với nhau, không có sự thống nhất với nhau"],"correct":[1],"page":29},{"id":"2-217","chapter":2,"number":217,"level":"TB","text":"Mâu thuẫn tác động trong suốt quá trình tồn tại của sự vật, hiện tượng; quy định bản chất, sự phát triển của chúng từ khi hình thành đến lúc tiêu vong là:","options":["Mâu thuẫn cơ bản","Mâu thuẫn bên trong","Mâu thuẫn chủ yếu","Mâu thuẫn bên ngoài"],"correct":[0],"page":30},{"id":"2-218","chapter":2,"number":218,"level":"TB","text":"Căn cứ vào vai trò của mâu thuẫn đối với sự tồn tại và phát triển của sự vật, hiện tượng trong mỗi giai đoạn nhất định; có thể phân chia mâu thuẫn thành:","options":["Mâu thuẫn chủ yếu và mâu thuẫn thứ yếu","Mâu thuẫn cơ bản và mâu thuẫn không cơ bản","Mâu thuẫn bên trong và mâu thuẫn bên ngoài","Mâu thuẫn đối kháng và mâu thuẫn không đối kháng"],"correct":[0],"page":30},{"id":"2-219","chapter":2,"number":219,"level":"TB","text":"Theo quan điểm của chủ nghĩa duy vật biện chứng, phủ định biện chứng có tính khách quan vì:","options":["Sự vật, hiện tượng tự phủ định mình; nguyên nhân của sự phủ định nằm bên ngoài sự vật, hiện tượng","Sự vật, hiện tượng tự phủ định mình; nguyên nhân của sự phủ định nằm trong chính bản thân sự vật, hiện tượng","Nguyên nhân của sự phủ định là do điều kiện tự nhiên tác động lên sự vật, hiện tượng","Nguyên nhân của sự phủ định là do tác động của con người lên sự vật hiện tượng"],"correct":[1],"page":30},{"id":"2-220","chapter":2,"number":220,"level":"TB","text":"Theo quan điểm của chủ nghĩa duy vật biện chứng:","options":["Sự phát triển của sự vật, hiện tượng diễn ra theo đường vòng tròn khép kín","Sự phát triển của sự vật, hiện tượng diễn ra theo đường thẳng từ thấp đến cao","Sự phát triển của sự vật, hiện tượng diễn ra theo đường xoáy ốc","Sự phát triển của sự vật, hiện tượng diễn ra theo đường thẳng nằm ngang"],"correct":[2],"page":30},{"id":"2-221","chapter":2,"number":221,"level":"TB","text":"Để hoàn thành một chu kỳ phát triển, sự vật, hiện tượng trải qua:","options":["Một lần phủ định","Hai lần phủ định","Nhiều hơn hai lần phủ định","Số lần phủ định tùy thuộc vào sự vật, hiện tượng cụ thể, nhưng ít nhất phải trải qua hai lần phủ định liên tiếp - (phủ định của phủ định)"],"correct":[3],"page":30},{"id":"2-222","chapter":2,"number":222,"level":"TB","text":"Theo quan điểm của chủ nghĩa duy vật biện chứng, thông qua phủ định của phủ định:","options":["Sự vật mới ra đời lặp lại sự vật cũ","Sự vật mới ra đời khác hoàn toàn sự vật cũ","Sự vật mới ra đời dường như lặp lại sự vật cũ nhưng trên cơ sở cao hơn","Sự vật mới ra đời theo ý muốn chủ quan của con người"],"correct":[2],"page":30},{"id":"2-223","chapter":2,"number":223,"level":"TB","text":"Theo quan điểm của chủ nghĩa duy vật biện chứng, đối tượng của nhận thức là:","options":["Ý thức","Con người","Thế giới khách quan","Hiện thực"],"correct":[2],"page":30},{"id":"2-224","chapter":2,"number":224,"level":"TB","text":"Theo quan điểm của chủ nghĩa duy vật biện chứng:","options":["Bản chất của nhận thức là sự sao chép y nguyên hình ảnh của thế giới khách quan vào bộ óc con người","Bản chất của nhận thức là quá trình phản ánh hiện thực khách quan một cách tích cực, chủ động, sáng tạo bởi con người trên cơ sở thực tiễn mang tính lịch sử cụ thể","Bản chất của nhận thức là sự phản ánh thế giới vật chất vào bộ óc con người","Bản chất của nhận thức là sự phản ánh trạng thái chủ quan của con người"],"correct":[1],"page":30},{"id":"2-225","chapter":2,"number":225,"level":"TB","text":"Theo quan điểm của chủ nghĩa duy vật biện chứng, nhận thức sự vật, hiện tượng một cách gián tiếp dựa trên các hình thức tư duy trừu tượng như khái niệm, phán đoán, suy luận để khái quát tính bản chất, quy luật, tính tất yếu của các sự vật, hiện tượng, là:","options":["Nhận thức kinh nghiệm","Nhận thức lý luận","Nhận thức thông thường","Nhận thức khoa học"],"correct":[1],"page":31},{"id":"2-226","chapter":2,"number":226,"level":"TB","text":"Theo quan điểm của chủ nghĩa duy vật biện chứng, nhận thức dựa trên sự quan sát trực tiếp các sự vật, hiện tượng hay các thí nghiệm, thực nghiệm khoa học, là:","options":["Nhận thức kinh nghiệm","Nhận thức lý luận","Nhận thức thông thường","Nhận thức khoa học"],"correct":[0],"page":31},{"id":"2-227","chapter":2,"number":227,"level":"TB","text":"Theo quan điểm của chủ nghĩa duy vật biện chứng, nhận thức được hình thành một cách tự phát, trực tiếp trong hoạt động hàng ngày của con người, là:","options":["Nhận thức kinh nghiệm","Nhận thức lý luận","Nhận thức thông thường","Nhận thức khoa học"],"correct":[2],"page":31},{"id":"2-228","chapter":2,"number":228,"level":"TB","text":"Theo quan điểm của chủ nghĩa duy vật biện chứng, nhận thức được hình thành một cách chủ động, tự giác của chủ thể nhằm phản ánh những mối liên hệ bản chất, tất nhiên mang tính quy luật của đối tượng nghiên cứu, là:","options":["Nhận thức kinh nghiệm","Nhận thức lý luận","Nhận thức thông thường","Nhận thức khoa học"],"correct":[3],"page":31},{"id":"2-229","chapter":2,"number":229,"level":"TB","text":"Theo quan điểm của chủ nghĩa duy vật biện chứng:","options":["Nhận thức là quá trình tác động biện chứng giữa chủ thể và khách thể thông qua hoạt động nhận thức của con người","Nhận thức là quá trình tác động biện chứng giữa chủ thể và khách thể thông qua hoạt động thực tiễn của con người","Nhận thức là quá trình tác động biện chứng giữa con người và thế giới khách quan thông qua hoạt động thực tiễn của con người","Nhận thức là quá trình tác động biện chứng giữa con người và thế giới khách quan thông qua hoạt động nhận thức của con người"],"correct":[1],"page":31},{"id":"2-230","chapter":2,"number":230,"level":"TB","text":"Theo quan điểm của chủ nghĩa duy vật biện chứng:","options":["Thực tiễn là toàn bộ hoạt động của con người","Thực tiễn là hoạt động nhận thức, hoạt động của ý thức, hoạt động của tinh thần nói chung","Thực tiễn là những hoạt động vật chất - cảm tính của con người","Thực tiễn là hoạt động sáng tạo ra vũ trụ của thượng đế"],"correct":[2],"page":31},{"id":"2-231","chapter":2,"number":231,"level":"TB","text":"Theo quan điểm của chủ nghĩa duy vật biện chứng, thực tiễn là tiêu chuẩn của chân lý:","options":["Có tính chất tương đối","Có tính chất tuyệt đối","Vừa có tính chất tuyệt đối, vừa có tính chất tương đối","Có tính chất toàn diện"],"correct":[2],"page":32},{"id":"2-232","chapter":2,"number":232,"level":"TB","text":"Theo quan điểm của chủ nghĩa duy vật biện chứng, quá trình nhận thức bao gồm:","options":["Nhận thức cảm tính và nhận thức lý tính","Nhận thức cảm giác và nhận thức lý tính","Nhận thức cụ thể và nhận thức trừu tượng","Nhận thức trực tiếp và nhận thức gián tiếp"],"correct":[0],"page":32},{"id":"2-233","chapter":2,"number":233,"level":"TB","text":"Hình thức cơ bản của tư duy trừu tượng, phản ánh khái quát, gián tiếp một hoặc một số thuộc tính chung có tính bản chất nào đó của một nhóm sự vật, hiện tượng được biểu thị bằng một từ hay một cụm từ là:","options":["Biểu tượng","Phán đoán","Khái niệm","Suy lý (suy luận)"],"correct":[2],"page":32},{"id":"2-234","chapter":2,"number":234,"level":"TB","text":"Theo quan điểm của chủ nghĩa duy vật biện chứng, một vòng khâu của quá trình nhận thức:","options":["Được bắt đầu từ trực quan sinh động đến tư duy trừu tượng và từ tư duy trừu tượng đến thực tiễn","Được bắt đầu từ thực tiễn đến trực quan sinh động và tư duy trừu tượng","Được bắt đầu từ tư duy trừu tượng, đến trực quan sinh động và thực tiễn","Được bắt đầu từ trực quan sinh động đến thực tiễn và tư duy trừu tượng"],"correct":[0],"page":32},{"id":"2-235","chapter":2,"number":235,"level":"TB","text":"Theo quan điểm của chủ nghĩa duy vật biện chứng:","options":["Chân lý là tri thức phù hợp với hiện thực khách quan và được thực tiễn kiểm nghiệm","Chân lý là tri thức phù hợp với thực tiễn và được thực tiễn kiểm nghiệm","Chân lý là tri thức phù hợp với nhận thức và được thực tiễn kiểm nghiệm","Chân lý là tri thức phù hợp với kinh nghiệm và được thực tiễn kiểm nghiệm"],"correct":[0],"page":32},{"id":"2-236","chapter":2,"number":236,"level":"TB","text":"Theo quan điểm của chủ nghĩa duy vật biện chứng, chân lý có tính khách quan vì:","options":["Chân lý phụ thuộc vào con người","Chân lý là bản thân hiện thực khách quan","Chân lý là tri thức phản ánh đúng hiện thực khách quan. Nội dung phản ánh của chân lý là khách quan, là phù hợp với khách thể của nhận thức","Chân lý phụ thuộc vào tính chặt chẽ của lôgích, vào lợi ích của con người"],"correct":[2],"page":32},{"id":"2-237","chapter":2,"number":237,"level":"KH","text":"Theo quan điểm của chủ nghĩa duy vật biện chứng, nếu tuyệt đối hóa vai trò của ý thức sẽ:","options":["Rơi vào chủ nghĩa khách quan","Rơi vào chủ nghĩa chủ quan, duy tâm, duy ý chí","Rơi vào chủ nghĩa xét lại","Rời vào chủ nghĩa duy vật siêu hình"],"correct":[1],"page":32},{"id":"2-238","chapter":2,"number":238,"level":"KH","text":"Nguyên tắc phương pháp luận rút ra từ mối quan hệ biện chứng giữa vật chất và ý thức là:","options":["Nguyên tắc tôn trọng tính khách quan kết hợp với phát huy tính năng động chủ quan","Nguyên tắc tôn trọng tính khách quan","Nguyên tắc phát huy tính năng động chủ quan","Nguyên tắc lịch sử - cụ thể"],"correct":[0],"page":32},{"id":"2-239","chapter":2,"number":239,"level":"KH","text":"Phép biện chứng duy vật:","options":["Phủ nhận mối liên hệ giữa các sự vật, hiện tượng","Thừa nhận mối liên hệ giữa các sự vật, hiện tượng nhưng cho rằng nền tảng của các mối liên hệ đó là cảm giác của con người","Thừa nhận sự vật, hiện tượng tồn tại trong nhiều mối liên hệ; cơ sở của các mối liên hệ là tính thống nhất vật chất của thế giới","Thừa nhận mối liên hệ giữa các sự vật, hiện tượng nhưng cho rằng nền tảng của các mối liên hệ đó là ý thức chủ quan của con người"],"correct":[2],"page":33},{"id":"2-240","chapter":2,"number":240,"level":"KH","text":"Cơ sở lý luận của nguyên tắc toàn diện là:","options":["Mối quan hệ giữa vật chất và ý thức","Nguyên lý về mối liên hệ phổ biến","Nguyên lý về sự phát triển","Các cặp phạm trù cơ bản của phép biện chứng duy vật"],"correct":[1],"page":33},{"id":"2-241","chapter":2,"number":241,"level":"KH","text":"Theo quan điểm của chủ nghĩa duy vật biện chứng, trong hoạt động nhận thức và thực tiễn cần: Thay lệnh hỏi","options":["Quán triệt quan điểm toàn diện","Quán triệt quan điểm phiến diện","Quán triệt thuật ngụy biện","Quán triệt chủ nghĩa chiết trung"],"correct":[0],"page":33},{"id":"2-242","chapter":2,"number":242,"level":"KH","text":"Nguyên lý về sự phát triển là cơ sở lý luận của:","options":["Nguyên tắc toàn diện","Nguyên tắc phát triển, nguyên tắc lịch sử cụ thể","Nguyên tắc khách quan","Nguyên tắc lịch sử - cụ thể"],"correct":[1],"page":33},{"id":"2-243","chapter":2,"number":243,"level":"KH","text":"Theo quan điểm của chủ nghĩa duy vật biện chứng, trong hoạt động thực tiễn cần:","options":["Dựa vào tất nhiên, bỏ qua ngẫu nhiên","Dựa vào tất nhiên và phải có những phương án dự phòng trường hợp các sự cố ngẫu nhiên xuất hiện bất ngờ","Dựa vào ngẫu nhiên, bỏ qua tất nhiên","Dựa vào cả tất nhiên và ngẫu nhiên"],"correct":[1],"page":33},{"id":"2-244","chapter":2,"number":244,"level":"KH","text":"Theo quan điểm của chủ nghĩa duy vật biện chứng, trong nhận thức:","options":["Con người không thể nhận thức được cái tất nhiên mà chỉ có thể nhận thức được cái ngẫu nhiên","Con người có thể nhận thức được cái tất nhiên nhưng không thể nhận thức được cái ngẫu nhiên","Con người chỉ có thể chỉ ra được tất nhiên bằng cách nghiên cứu những ngẫu nhiên mà tất nhiên phải đi qua","Con người không thể nhận thức được tất nhiên cũng như ngẫu nhiên"],"correct":[2],"page":33},{"id":"2-245","chapter":2,"number":245,"level":"KH","text":"Theo quan điểm của chủ nghĩa duy vật biện chứng:","options":["Sự hiện thực hóa từng khả năng đòi hỏi phải có các điều kiện tương ứng","Sự hiện thực hóa các khả năng không cần bất cứ điều kiện gì","Sự hiện thực hóa các khả năng đòi hỏi phải có các điều kiện giống nhau","Không phải hiện thực hóa khả năng nào cũng cần điều kiện"],"correct":[0],"page":33},{"id":"2-246","chapter":2,"number":246,"level":"KH","text":"Từ vai trò của thực tiễn đối với nhận thức, trong nhận thức và hoạt động chúng ta cần:","options":["Quán triệt quan điểm phát triển","Quán triệt quan điểm thực tiễn","Quán triệt quan điểm toàn diện","Quán triệt quan điểm lịch sử - cụ thể"],"correct":[1],"page":34},{"id":"2-247","chapter":2,"number":247,"level":"KH","text":"Theo quan điểm của chủ nghĩa duy vật biện chứng, trong thực tiễn nếu cường điệu, tuyệt đối hóa vai trò của nhận thức cảm tính, hạ thấp và phủ nhận vai trò của nhận thức lý tính, sẽ rơi vào:","options":["Chủ nghĩa duy cảm","Chủ nghĩa duy tâm","Chủ nghĩa duy lý","Chủ nghĩa duy vật siêu hình"],"correct":[0],"page":34},{"id":"2-248","chapter":2,"number":248,"level":"KH","text":"Theo quan điểm của chủ nghĩa duy vật biện chứng, trong thực tiễn nếu cường điệu thái quá vai trò của nhận thức lý tính, của trí tuệ sẽ rơi vào:","options":["Chủ nghĩa duy cảm","Chủ nghĩa duy tâm","Chủ nghĩa duy lý","Chủ nghĩa thực dụng"],"correct":[2],"page":34},{"id":"2-249","chapter":2,"number":249,"level":"KH","text":"Câu tục ngữ “Có thực mới vực được đạo” thể hiện nguyên lý triết học:","options":["Vai trò của thực tiễn đối với nhận thức","Vai trò của vật chất đối với ý thức","Mối quan hệ giữa chất và lượng","Mối quan hệ giữa cái chung và cái riêng"],"correct":[1],"page":34},{"id":"2-250","chapter":2,"number":250,"level":"KH","text":"Câu tục ngữ “Cái khó ló cái khôn” thể hiện:","options":["Tính năng động sáng tạo của ý thức","Mối liên hệ nguyên nhân và kết quả","Mối liên hệ tất nhiên và ngẫu nhiên","Mối liên hệ giữa bản chất và hiện tượng"],"correct":[0],"page":34},{"id":"2-251","chapter":2,"number":251,"level":"KH","text":"Câu tục ngữ “Gần mực thì đen, gần đèn thì rạng” thể hiện tư tưởng triết học:","options":["Mối liên hệ nhân quả giữa các sự vật, hiện tượng trong thế giới Hay vật chất nào thì ý thức ấy","Mối liên hệ giữa nguyên nhân và kết quả","Mối liên hệ giữa khả năng và hiện thực","Mối liên hệ giữa tất nhiên và ngẫu nhiên"],"correct":[0],"page":34},{"id":"2-252","chapter":2,"number":252,"level":"KH","text":"Câu tục ngữ “Không có lửa thì làm sao có khói” thể hiện tư tưởng triết học:","options":["Mối quan hệ giữa lượng và chất","Mối quan hệ giữa bản chất và hiện tượng","Mối quan hệ giữa nguyên nhân và kết quả","Mối liên hệ giữa khả năng và hiện thực"],"correct":[2],"page":34},{"id":"2-253","chapter":2,"number":253,"level":"KH","text":"Câu tục ngữ “Tích tiểu thành đại” thể hiện tư tưởng triết học:","options":["Mối quan hệ giữa tất nhiên và ngẫu nhiên","Mối quan hệ giữa cái chung và cái riêng","Mối quan hệ giữa nội dung và hình thức","Sự thay đổi về lượng dẫn đến sự thay đổi về chất của sự vật"],"correct":[3],"page":34},{"id":"2-254","chapter":2,"number":254,"level":"KH","text":"Câu tục ngữ “nước chảy chỗ trũng” thể hiện tư tưởng triết học:","options":["Phạm trù ngẫu nhiên","Phạm trù tất nhiên","Phạm trù khả năng","Phạm trù hiện thực"],"correct":[1],"page":35},{"id":"2-255","chapter":2,"number":255,"level":"KH","text":"Câu tục ngữ “Lên non mới biết non cao; lội sông mới biết sông nào cạn sâu” thể hiện tư tưởng triết học:","options":["Mối quan hệ giữa nguyên nhân và kết quả","Mối quan hệ giữa tất nhiên và ngẫu nhiên","Thực tiễn là tiêu chuẩn của chân lý","Mối liên hệ giữa khả năng và hiện thực"],"correct":[2],"page":35},{"id":"2-256","chapter":2,"number":256,"level":"KH","text":"Câu tục ngữ “Đi một ngày đàng học một sàng khôn” thể hiện tư tưởng triết học:","options":["Thực tiễn là cơ sở, động lực của nhận thức","Sự thay đổi về lượng dẫn đến thay đổi về chất của sự vật","Vật chất quyết định ý thức","Tồn tại xã hội quyết định ý thức xã hội"],"correct":[0],"page":35},{"id":"2-257","chapter":2,"number":257,"level":"KH","text":"Câu tục ngữ “tre già măng mọc” thể hiện tư tưởng triết học:","options":["Quy luật chuyển hóa từ những sự thay đổi về lượng dẫn đến những thay đổi về chất và ngược lại","Quy luật thống nhất và đấu tranh của các mặt đối lập","Quy luật phủ định của phủ định","Quy luật quan hệ sản xuấ phù hợp với trình độ phát triển của lực lượng sản xuất"],"correct":[2],"page":35},{"id":"2-258","chapter":2,"number":258,"level":"KH","text":"Câu tục ngữ “Quá mù ra mưa” thể hiện tư tưởng triết học:","options":["Nguyên nhân sinh ra kết quả","Sự tích lũy về lượng đạt tới điểm nút dẫn đến sự thay đổi về chất của sự vật","Mối quan hệ giữa tất nhiên và ngẫu nhiên","Mối quan hệ giữa nội dung và hình thức"],"correct":[1],"page":35},{"id":"2-259","chapter":2,"number":259,"level":"KH","text":"Câu tục ngữ “tốt gỗ hơn tốt nước sơn; xấu người đẹp nết còn hơn đẹp người” thể hiện tư tưởng triết học:","options":["Mối quan hệ giữa bản chất và hiện tượng","Nhấn mạnh vai trò của nội dung trong mối quan hệ với hình thức","Mối quan hệ giữa các mặt đối lập","Mối quan hệ giữa tất nhiên và ngẫu nhiên"],"correct":[1],"page":35},{"id":"2-260","chapter":2,"number":260,"level":"KH","text":"Câu tục ngữ “Người khôn dồn ra mặt”, “Người thanh tiếng nói cũng thanh” thể hiện tư tưởng triết học:","options":["Mối quan hệ giữa tất nhiên và ngẫu nhiên","Mối quan hệ giữa bản chất và hiện tượng","Mối quan hệ giữa khả năng và hiện thực","Mối quan hệ giữa nội dung và hình thức"],"correct":[1],"page":35},{"id":"3-261","chapter":3,"number":261,"level":"DE","text":"Điền cụm từ thích hợp để hoàn thiện quan điểm sau: “Cái sự thật hiển nhiên… là trước hết con người cần phải ăn, uống, ở, mặc, nghĩa là phải …......., trước khi có thể đấu tranh để giành quyền thống trị”","options":["Học tập","Lao động","Sáng tạo","Nghiên cứu"],"correct":[1],"page":36},{"id":"3-262","chapter":3,"number":262,"level":"DE","text":"Điền cụm từ thích hợp để hoàn thiện quan điểm sau: “Theo quan điểm duy vật về lịch sử, nhân tố quyết định trong quá trình lịch sử xét đến cùng là …....... ra đời sống hiện thực”.","options":["Sản xuất vật chất","Sản xuất","Sản xuất và tái sản xuất","Sản xuất ..... thôi”.","options":["Cuộc cách mạng bạo lực","Cách mạng vô sản","Cách mạng kinh tế","Cách mạng chính trị"],"correct":[0],"page":41},{"id":"3-298","chapter":3,"number":298,"level":"DE","text":"Điền cụm từ thích hợp vào chỗ trống để hoàn thiện quan điểm sau: “Giai cấp nào chi phối những……........... thì cũng chi phối luôn cả những tư liệu sản xuất tinh thần”","options":["tư liệu sản xuất","tư liệu sản xuất vật chất","tư liệu sinh hoạt","tư liệu sản xuất tinh thần"],"correct":[1],"page":41},{"id":"3-299","chapter":3,"number":299,"level":"DE","text":"Điền vào chỗ trống để hoàn thiện câu của C. Mác “Trong tính hiện thực của nó, bản chất con người là tổng hòa .............”.","options":["những quan hệ sản xuất","những quan hệ xã hội","những quan hệ giao tiếp","những quan hệ giai cấp"],"correct":[1],"page":41},{"id":"3-300","chapter":3,"number":300,"level":"DE","text":"Điền vào chỗ trống để hoàn thiện quan điểm sau: “Người là giống vật duy nhất có thể bằng …...... mà thoát khỏi trạng thái thuần túy là loài vật”","options":["sáng tạo","lao động","tiến hóa","di truyền"],"correct":[1],"page":41},{"id":"3-301","chapter":3,"number":301,"level":"DE","text":"Điền cụm từ thích hợp vào chỗ trống để hoàn thiện quan điểm sau: “Xã hội không thể nào giải phóng cho mình được, nếu không giải phóng cho …..........”","options":["Mỗi cá nhân riêng biệt","Tất cả mọi người","Toàn thể nhân dân","Quốc gia, dân tộc"],"correct":[0],"page":41},{"id":"3-302","chapter":3,"number":302,"level":"DE","text":"Vai trò là chủ thể sáng tạo chân chính, là động lực phát triển của lịch sử của quần chúng nhân dân được thể hiện ở:","options":["05 nội dung","06 nội dung","07 nội dung","08 nội dung"],"correct":[1],"page":41},{"id":"3-303","chapter":3,"number":303,"level":"DE","text":"Theo Chủ tịch Hồ Chí Minh, con người toàn diện là con người:","options":["Có đức","Có tài","Có trí tuệ","Có cả đức và tài (vừa hồng vừa chuyên)"],"correct":[3],"page":41},{"id":"3-304","chapter":3,"number":304,"level":"TB","text":"Các nhà triết học duy vật trước C. Mác, khi xem xét bản chất con người và xã hội đã:","options":["Thiếu tính thực tiễn, không xuất phát từ thực tiễn, không hiểu được vai trò hoạt động thực tiễn có tính cách mạng của con người","Xuất phát từ thực tiễn","Xuất phát từ hoạt động thực tiễn của con người","Xuất phát từ tinh thần thế giới"],"correct":[0],"page":42},{"id":"3-305","chapter":3,"number":305,"level":"TB","text":"Những nhà sáng lập ra triết học Mác khi nghiên cứu về lịch sử xã hội đã xuất phát từ:","options":["Con người hiện thực, sống và hoạt động thực tiễn","Lĩnh vực tư tưởng, tinh thần","Nghiên cứu lịch sử","Nền văn minh lúa nước"],"correct":[0],"page":42},{"id":"3-306","chapter":3,"number":306,"level":"TB","text":"Lần đầu tiên trong lịch sử tư tưởng triết học, chủ nghĩa duy vật lịch sử đã chỉ ra:","options":["Những quy luật, những động lực phát triển tự nhiên","Những quy luật, những động lực phát triển chung nhất","Những quy luật, những động lực phát triển khoa học","Những quy luật, những động lực phát triển xã hội"],"correct":[3],"page":42},{"id":"3-307","chapter":3,"number":307,"level":"TB","text":"Theo quan điểm của chủ nghĩa duy vật lịch sử, phải tìm cơ sở sâu xa của các hiện tượng xã hội ở:","options":["Trong tư tưởng, tinh thần, ý chí chủ quan của con người","Trong nền sản xuất vật chất của xã hội","Trong chủ trương, chính sách của nhà nước","Trong truyền thống văn hóa xã hội"],"correct":[1],"page":42},{"id":"3-308","chapter":3,"number":308,"level":"TB","text":"Theo Ph. Ăngghen, điểm khác biệt căn bản giữa xã hội loài người với xã hội loài vật là ở chỗ:","options":["Loài vật may mắn chỉ hái lượm trong khi con người lại sản xuất vật chất","Loài vật may mắn chỉ hái lượm trong khi con người biết trồng trọt","Loài vật chỉ biết tìm kiếm trong khi con người biết trồng trọt","Loài người tự mình làm ra lịch sử của mình trong khi loài vật thì không"],"correct":[0],"page":42},{"id":"3-309","chapter":3,"number":309,"level":"TB","text":"“Sự sản xuất xã hội” bao gồm các phương diện:","options":["Sản xuất vật chất và sản xuất ra bản thân con người","Sản xuất vật chất và sản xuất tinh thần","Sản xuất tinh thần và sản xuất ra bản thân con người","Sản xuất vật chất, sản xuất tinh thần và sản xuất ra bản thân con người"],"correct":[3],"page":42},{"id":"3-310","chapter":3,"number":310,"level":"TB","text":"Trong ba phương diện của sự sản xuất xã hội, phương diện giữ vai trò là cơ sở của sự tồn tại và phát triển của xã hội loài người là:","options":["Sản xuất vật chất","Sản xuất tinh thần","Sản xuất ra bản thân con người","Sản xuất tự nhiên"],"correct":[0],"page":42},{"id":"3-311","chapter":3,"number":311,"level":"TB","text":"Sản xuất vật chất là một loại hoạt động có tính:","options":["Chủ quan, xã hội, lịch sử và sáng tạo","Xã hội, lịch sử, phổ biến và sáng tạo","Phổ biến, toàn diện, sáng tạo, lịch sử","Khách quan, xã hội, lịch sử và sáng tạo"],"correct":[3],"page":42},{"id":"3-312","chapter":3,"number":312,"level":"TB","text":"Theo quan điểm của chủ nghĩa duy vật lịch sử:","options":["Sự phát triển của các thể chế nhà nước, các quan điểm pháp quyền, nghệ thuật quyết định sự phát triển của xã hội từ thấp đến cao","Sự phát triển của sản xuất vật chất quyết định sự biến đổi, phát triển các mặt của đời sống xã hội","Sự phát triển của khoa học kỹ thuật và công nghệ quyết định sự biến đổi, phát triển các mặt của đời sống xã hội","Sự phát triển của tôn giáo quyết định sự biến đổi, phát triển các mặt của đời sống xã hội"],"correct":[1],"page":43},{"id":"3-313","chapter":3,"number":313,"level":"TB","text":"Theo C. Mác, tiền đề đầu tiên của mọi sự tồn tại của con người, và do đó là tiền đề của mọi lịch sử, đó là:","options":["Người ta phải có cái ăn đã rồi mới có thể làm ra lịch sử","Người ta phải có khả năng sống đã rồi mới có thể làm ra lịch sử (việc thỏa mãn nhu cầu của con người: ăn, ở, đi lại…)","Người ta phải có tư liệu sinh hoạt đã rồi mới có thể làm ra lịch sử","Người ta phải sản xuất ra của cải vật chất đã rồi mới có thể làm ra lịch sử"],"correct":[1],"page":43},{"id":"3-314","chapter":3,"number":314,"level":"TB","text":"Theo chủ nghĩa duy vật lịch sử, sự vận động, phát triển của toàn bộ đời sống xã hội, suy đến cùng có nguyên nhân từ:","options":["Tình trạng phát triển của nền sản xuất của xã hội","Tình trạng phát triển của quan hệ sản xuất của xã hội đó","Tình trạng phát triển của chế độ chính trị của xã hội","Tình trạng phát triển văn hóa của xã hội đó"],"correct":[0],"page":43},{"id":"3-315","chapter":3,"number":315,"level":"TB","text":"Chủ nghĩa duy vật lịch sử cho rằng:","options":["Các thời đại kinh tế khác nhau căn bản là ở trình độ phát triển của công cụ lao động, của khoa học công nghệ","Các thời đại kinh tế khác nhau căn bản là ở trình độ phát triển của phân công lao động xã hội, của quan hệ sản xuất xã hội","Các thời đại kinh tế khác nhau căn bản là ở trình độ của người lao động","Các thời đại kinh tế khác nhau căn bản không phải ở chỗ nó sản xuất ra cái gì mà là ở chỗ nó được tiến hành bằng cách nào, với công cụ gì"],"correct":[3],"page":43},{"id":"3-316","chapter":3,"number":316,"level":"TB","text":"Cơ sở làm phát sinh những mối quan hệ xã hội: chính trị, đạo đức, pháp luật, ... là do:","options":["Trình độ nhận thức của con người ngày càng cao","Quan hệ giữa con người với con người ngày càng phức tạp","Những quan hệ sản xuất vật chất của xã hội","Ý muốn của giai cấp thống trị xã hội"],"correct":[2],"page":43},{"id":"3-317","chapter":3,"number":317,"level":"TB","text":"Phương thức sản xuất là:","options":["Cách thức con người tồn tại","Cách thức mà con người tiến hành quá trình sản xuất ở những gia đoạn lịch sử nhất định của xã hội loài người","Cách thức con người tạo ra của cải vật chất","Sự kết hợp giữa người lao động và tư liệu sản xuất"],"correct":[1],"page":43},{"id":"3-318","chapter":3,"number":318,"level":"TB","text":"Theo quan điểm của chủ nghĩa duy vật lịch sử, mỗi phương thức sản xuất gồm có hai mặt:","options":["Vật chất và tinh thần","Lực lượng sản xuất và quan hệ sản xuất","Người lao động và tư liệu sản xuất","Tự nhiên và xã hội"],"correct":[1],"page":43},{"id":"3-319","chapter":3,"number":319,"level":"TB","text":"Mối quan hệ “song trùng” giữa lực lượng sản xuất và quan hệ sản xuất được biểu hiện ở:","options":["Mối quan hệ giữa con người với con người","Mối quan hệ giữa con người với giới tự nhiên","Mối quan hệ giữa con người với giới tự nhiên và con người với con người","Mối quan hệ giữa kinh tế với chính trị"],"correct":[2],"page":44},{"id":"3-320","chapter":3,"number":320,"level":"TB","text":"Về mặt cấu trúc, lực lượng sản xuất được xem xét trên những mặt:","options":["Mặt kinh tế - kỹ thuật và mặt kinh tế - xã hội","Mặt vật chất và tinh thần","Mặt tự nhiên và xã hội","Mặt xã hội và tư duy"],"correct":[0],"page":44},{"id":"3-321","chapter":3,"number":321,"level":"TB","text":"Mặt kinh tế - kỹ thuật trong lực lượng sản xuất đại diện cho:","options":["Của cải vật chất","Công cụ lao động","Tư liệu lao động","Tư liệu sản xuất"],"correct":[3],"page":44},{"id":"3-322","chapter":3,"number":322,"level":"TB","text":"Mặt kinh tế - xã hội trong lực lượng sản xuất đại diện cho:","options":["Nhà nước","Doanh nghiệp","Người lao động","Nhân loại"],"correct":[2],"page":44},{"id":"3-323","chapter":3,"number":323,"level":"TB","text":"Lực lượng sản xuất bao gồm những yếu tố:","options":["Người lao động và công cụ lao động","Người lao động và tư liệu lao động","Người lao động và tư liệu sản xuất","Người lao động và đối tượng lao động"],"correct":[2],"page":44},{"id":"3-324","chapter":3,"number":324,"level":"TB","text":"Người lao động đóng vai trò:","options":["Là người chủ của xã hội","Là chủ thể sáng tạo và chủ thể tiêu dùng mọi của cải vật chất xã hội","Là người tiêu dùng mọi của cải vật chất xã hội","Là sáng tạo ra lịch sử xã hội"],"correct":[1],"page":44},{"id":"3-325","chapter":3,"number":325,"level":"TB","text":"Tư liệu sản xuất gồm:","options":["Lực lượng sản xuất và quan hệ sản xuất","Vật chất và tinh thần","Lý luận và thực tiễn","Tư
